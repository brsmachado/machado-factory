<script id="docs" type="application/json">[{"arq": "README.md", "titulo": "Visão geral", "sub": "Por onde começar, princípios e infraestrutura", "html": "<p>Sistema de gestão do capital próprio que Bruno aplica nas compras da Machado\nEmbalagens.</p>\n<p><strong>O que o sistema faz, em uma frase:</strong> registra que o investidor pagou um\nfornecedor à vista com desconto, acompanha as duplicatas que a empresa devolve, e\ncalcula quanto isso rende por mês — inclusive quanto custa o dinheiro que fica\nparado no caixa.</p>\n<p>Esta documentação descreve o sistema a ser construído. Hoje a operação roda numa\npágina HTML com os dados embutidos (artefato publicado no Claude); o conteúdo\ndessa página é a especificação funcional validada em produção desde agosto/2026,\ncom 7 operações e R$ 150.000 de capital.</p>\n<h2>Índice</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Arquivo</th>\n<th>O que tem dentro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"01-dominio.md\">01-dominio.md</a></td>\n<td>Glossário, ciclo de vida, regras de negócio numeradas, armadilhas reais</td>\n</tr>\n<tr>\n<td><a href=\"02-modelo-dados.md\">02-modelo-dados.md</a></td>\n<td>DDL PostgreSQL completo, constraints, triggers, views</td>\n</tr>\n<tr>\n<td><a href=\"03-formulas.md\">03-formulas.md</a></td>\n<td>Todo o cálculo com exemplos conferidos nos dados reais</td>\n</tr>\n<tr>\n<td><a href=\"04-api.md\">04-api.md</a></td>\n<td>Endpoints REST, payloads, erros, idempotência</td>\n</tr>\n<tr>\n<td><a href=\"05-telas.md\">05-telas.md</a></td>\n<td>Telas, estados, validação de formulário</td>\n</tr>\n<tr>\n<td><a href=\"06-robo.md\">06-robo.md</a></td>\n<td>Os três robôs: ingestão, conciliação e alerta de caixa parado</td>\n</tr>\n<tr>\n<td><a href=\"07-migracao.md\">07-migracao.md</a></td>\n<td>Como importar os dados que já existem</td>\n</tr>\n<tr>\n<td><a href=\"08-deploy.md\">08-deploy.md</a></td>\n<td>VPS Hostinger, domínio Locaweb, HTTPS, backup e cron</td>\n</tr>\n<tr>\n<td><a href=\"seed/estado-2026-10-19.json\">seed/estado-2026-10-19.json</a></td>\n<td>Os dados reais de hoje, para carga inicial e testes</td>\n</tr>\n</tbody>\n</table></div>\n<h2>Cinco princípios que não se negociam</h2>\n<p><strong>1. Dinheiro é <code>NUMERIC(14,2)</code>, nunca <code>float</code>.</strong> Em nenhuma camada — nem no\nbanco, nem na API, nem no JavaScript da tela. No front, trabalhe com centavos\ninteiros ou com string decimal. <code>0.1 + 0.2 !== 0.3</code> já custou dinheiro a muita\ngente.</p>\n<p><strong>2. Datas de negócio são <code>DATE</code>, sem hora, no fuso <code>America/Sao_Paulo</code>.</strong>\nVencimento, pagamento e recebimento são dias, não instantes. Timestamp com fuso\nsó para auditoria (<code>criado_em</code>, <code>atualizado_em</code>).</p>\n<p><strong>3. Nada é apagado.</strong> Operação errada é <strong>estornada</strong>, não deletada. Recebimento\nerrado é <strong>desfeito</strong>, e o desfazer fica no log. Toda alteração grava em\n<code>evento</code>. Isso é dinheiro de verdade: a trilha de auditoria vale mais que a\nlimpeza da tabela.</p>\n<p><strong>4. O robô nunca grava uma operação financeira sozinho.</strong> Ele lê os documentos,\nmonta um <strong>rascunho</strong> e para. Uma pessoa confere e confirma. A única coisa que o\nrobô pode gravar sem aprovação é um alerta.</p>\n<p><strong>5. Existem duas taxas diferentes e elas nunca podem ser confundidas.</strong> O\ndesconto do fornecedor é calculado sobre o valor cheio; o retorno do investidor é\ncalculado sobre o que saiu do bolso dele, que é menor. Um desconto de 4% rende\n4,17%. Toda tela, relatório e campo precisa dizer qual das duas está mostrando.\nVer <a href=\"01-dominio.md#rn-07--as-duas-taxas\">RN-07</a>.</p>\n<h2>Infraestrutura</h2>\n<ul>\n<li><strong>Servidor:</strong> VPS Hostinger (Ubuntu 22.04/24.04)</li>\n<li><strong>Domínio:</strong> registrado na Locaweb — entra por um <strong>registro A</strong> apontando\n  <code>caixa.&lt;dominio&gt;</code> para o IP da VPS. Os nameservers ficam na Locaweb para não\n  derrubar o e-mail. Detalhes em <a href=\"08-deploy.md\">08-deploy.md</a>.</li>\n<li><strong>Banco:</strong> PostgreSQL 15+ (o DDL está em Postgres; adaptar para MySQL é direto)</li>\n<li><strong>API:</strong> qualquer coisa que fale REST — FastAPI, Node/Express, Laravel</li>\n<li><strong>Front:</strong> a página atual já é HTML+JS puro e pode virar o front quase sem\n  mudança, trocando o estado embutido por chamadas à API</li>\n<li><strong>Agendador:</strong> cron no servidor, ou um worker com fila para os robôs</li>\n<li><strong>Armazenamento de documentos:</strong> sistema de arquivos do servidor, na mesma\n  convenção de pastas que já está em uso (ver <a href=\"07-migracao.md\">07-migracao.md</a>)</li>\n</ul>\n<h2>Tamanho real do problema</h2>\n<p>Para calibrar expectativa: em três meses de operação são <strong>7 operações, 11\nduplicatas, 2 aportes</strong>. O volume anual projetado fica na casa de 50 a 100\noperações. Isso não é um sistema de alto volume — é um sistema que precisa estar\n<strong>certo</strong>, não rápido. Escolha simplicidade sobre arquitetura.</p>"}, {"arq": "01-dominio.md", "titulo": "Domínio", "sub": "Glossário, regras de negócio e armadilhas reais", "html": "<h2>1. O negócio em três parágrafos</h2>\n<p>A Machado Embalagens compra de fornecedores a prazo — tipicamente duplicatas em\n30 e 40 dias. Quando o fornecedor oferece desconto para pagamento à vista, quem\npaga é o <strong>investidor</strong> (Bruno), com dinheiro próprio, direto ao fornecedor via\nPIX.</p>\n<p>A empresa então registra no contas a pagar uma duplicata <strong>em nome do\ninvestidor</strong>, pelo valor cheio da compra, com o vencimento original. Nos\ndocumentos isso aparece como <code>PIX 34277300855 — FAZER PAGAMENTO CONTA BRUNO</code>.</p>\n<p>O investidor paga menos do que vai receber. A diferença — o desconto que o\nfornecedor concedeu — é o lucro dele. O sistema existe para saber quanto disso\njá voltou, quanto está na rua, e se o capital está rendendo ou dormindo.</p>\n<pre><code>Fornecedor  ──NF R$ 9.725,00 (30 dias)──&gt;  Machado Embalagens\n     ^                                            |\n     | PIX R$ 9.336,00 à vista                    | duplicata R$ 9.725,00\n     |                                            v  venc. 24/10\n  Investidor  &lt;─────── R$ 9.725,00 em 24/10 ──────┘\n\n  Saiu 9.336,00 · Voltou 9.725,00 · Lucro 389,00 em 30 dias\n</code></pre>\n<h2>2. Glossário</h2>\n<p>Use estes termos em código, banco, API e tela. Mistura de vocabulário é a maior\nfonte de bug neste domínio.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo</th>\n<th>Significado</th>\n<th>Campo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Operação</strong></td>\n<td>Uma compra paga à vista pelo investidor</td>\n<td><code>operacao</code></td>\n</tr>\n<tr>\n<td><strong>Valor cheio</strong></td>\n<td>O que a empresa devolve ao investidor; soma das duplicatas</td>\n<td><code>operacao.valor_cheio</code></td>\n</tr>\n<tr>\n<td><strong>Valor pago</strong></td>\n<td>O PIX que saiu da conta do investidor para o fornecedor</td>\n<td><code>operacao.valor_pago</code></td>\n</tr>\n<tr>\n<td><strong>Lucro</strong></td>\n<td><code>valor_cheio − valor_pago</code></td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Duplicata</strong></td>\n<td>Cada parcela do retorno, com valor e vencimento</td>\n<td><code>duplicata</code></td>\n</tr>\n<tr>\n<td><strong>Desconto</strong></td>\n<td><code>lucro ÷ valor_cheio</code> — a taxa que o <strong>fornecedor</strong> concedeu</td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Retorno</strong></td>\n<td><code>lucro ÷ valor_pago</code> — a taxa que o <strong>investidor</strong> ganhou</td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Aporte</strong></td>\n<td>Dinheiro novo que o investidor coloca no caixa</td>\n<td><code>movimento_caixa</code></td>\n</tr>\n<tr>\n<td><strong>Retirada</strong></td>\n<td>Dinheiro que o investidor tira do caixa</td>\n<td><code>movimento_caixa</code></td>\n</tr>\n<tr>\n<td><strong>Caixa disponível</strong></td>\n<td>Dinheiro livre para uma nova compra</td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Aplicado</strong> / <strong>na rua</strong></td>\n<td>Capital dentro de duplicatas ainda não recebidas</td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Capital total</strong></td>\n<td><code>caixa + aplicado</code></td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Dinheiro parado</strong></td>\n<td>O caixa que não está sendo usado — custa lucro</td>\n<td>calculado</td>\n</tr>\n<tr>\n<td><strong>Prazo médio</strong></td>\n<td>Dias até o retorno, ponderados pelo valor de cada duplicata</td>\n<td>calculado</td>\n</tr>\n</tbody>\n</table></div>\n<p>Evite: \"fatura\", \"boleto\", \"título\", \"parcela\", \"empréstimo\", \"juros\". Nenhum\ndesses é o que acontece aqui, e cada um traz um modelo mental errado junto.</p>\n<h2>3. Ciclo de vida da operação</h2>\n<pre><code>                    ┌──────────────┐\n   robô lê docs ───&gt; │   rascunho   │ ──aprovação──┐\n                    └──────────────┘              │\n                           │ descarte             v\n                           v              ┌──────────────┐\n                       (arquivado)        │  confirmada  │\n                                          └──────────────┘\n                                                 │\n                            ┌────────────────────┼──────────────────┐\n                            v                    v                  v\n                    1ª duplicata            todas recebidas      estorno\n                      recebida                    │                  │\n                            v                     v                  v\n                    ┌──────────────┐      ┌──────────────┐   ┌──────────────┐\n                    │   parcial    │─────&gt;│  encerrada   │   │  estornada   │\n                    └──────────────┘      └──────────────┘   └──────────────┘\n</code></pre>\n<p><code>parcial</code> e <code>encerrada</code> <strong>não são campos</strong> — são derivados das duplicatas:</p>\n<pre><code>nenhuma recebida            → em aberto\nalguma recebida, falta      → parcial\ntodas recebidas             → encerrada\nalguma vencida e não paga   → atrasada   (flag independente, pode somar com parcial)\n</code></pre>\n<p>Guarde em <code>operacao.situacao</code> apenas <code>rascunho</code>, <code>confirmada</code> e <code>estornada</code>.\nDerive o resto, sempre. Um campo de status redundante vai dessincronizar.</p>\n<h2>4. Regras de negócio</h2>\n<h3>RN-01 — A soma das duplicatas é o valor cheio</h3>\n<p><code>Σ duplicata.valor = operacao.valor_cheio</code>, com tolerância zero.</p>\n<p>Quando o sistema divide um valor cheio em N duplicatas, a <strong>última absorve a\ndiferença de arredondamento</strong>:</p>\n<pre><code>parte = floor(valor_cheio / n * 100) / 100\núltimas = valor_cheio − (parte × (n−1))\n</code></pre>\n<p>Exemplo real: R$ 25.951,80 em 2 → 12.975,90 + 12.975,90. Com R$ 10.000,00 em 3 →\n3.333,33 + 3.333,33 + 3.333,34.</p>\n<p>Validar por trigger no banco, não só na aplicação.</p>\n<h3>RN-02 — O valor pago não pode passar do valor cheio</h3>\n<p><code>valor_pago ≤ valor_cheio</code>. Igual é permitido (lucro zero) mas a tela avisa.\nMaior é erro de digitação — bloquear.</p>\n<h3>RN-03 — Não se compra sem caixa</h3>\n<p>No momento do lançamento, <code>valor_pago ≤ caixa_disponível</code>. A mensagem de erro\nprecisa dizer quanto há e o que fazer:</p>\n<blockquote>\n<p>Caixa insuficiente: você tem R$ 2.913,60 livre. Registre um aporte antes de\nlançar esta compra.</p>\n</blockquote>\n<p>Ao <strong>editar</strong> uma operação já existente, o caixa disponível para a conta é\n<code>caixa + valor_pago_anterior − já_recebido_dela</code> — senão a própria operação\nbloqueia a edição de si mesma.</p>\n<h3>RN-04 — Recebimento não acontece antes do pagamento</h3>\n<p><code>duplicata.recebida_em ≥ operacao.data_pagamento</code>. Pode ser antes do vencimento\n(antecipação) ou depois (atraso) — ambos são normais e devem ser aceitos sem\nalarde.</p>\n<h3>RN-05 — Retirada limitada ao caixa</h3>\n<p><code>valor_retirada ≤ caixa_disponível</code>. Sem exceção: o capital na rua não pode ser\nsacado porque ainda não voltou.</p>\n<h3>RN-06 — Operação com dinheiro recebido não se apaga</h3>\n<p>Se qualquer duplicata tem <code>recebida_em</code>, a operação só sai por <strong>estorno</strong>, que\ncria os lançamentos contrários e mantém o histórico. Operação sem nenhum\nrecebimento pode ser excluída logicamente (<code>situacao = 'estornada'</code>).</p>\n<h3>RN-07 — As duas taxas</h3>\n<pre><code>desconto = lucro / valor_cheio      ← a negociação com o fornecedor\nretorno  = lucro / valor_pago       ← o ganho do investidor\nretorno  = desconto / (1 − desconto)\n</code></pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Desconto</th>\n<th>Retorno</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3,00%</td>\n<td>3,09%</td>\n</tr>\n<tr>\n<td>4,00%</td>\n<td>4,17%</td>\n</tr>\n<tr>\n<td>5,00%</td>\n<td>5,26%</td>\n</tr>\n<tr>\n<td>10,00%</td>\n<td>11,11%</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Toda taxa exibida no sistema é o retorno sobre o valor pago.</strong> O desconto\naparece como informação secundária, sempre rotulado \"desconto no valor cheio\".\nMisturar os dois já gerou confusão real no uso da ferramenta.</p>\n<h3>RN-08 — O lucro é apropriado dia a dia</h3>\n<p>O lucro de uma operação <strong>não</strong> é jogado inteiro no mês da compra. Ele é\ndistribuído linearmente pelos dias entre o pagamento e o vencimento de cada\nduplicata, para que cada mês mostre o dinheiro que realmente esteve na rua\nnaquele período. Fórmula em <a href=\"03-formulas.md#5-resultado-por-mês-competência\">03-formulas.md</a>.</p>\n<h3>RN-09 — O prazo conta do pagamento, não do pedido</h3>\n<p><code>data_pagamento</code> é o que inicia a contagem, porque é quando o dinheiro sai. Pode\nser diferente da <code>data_pedido</code>. Caso real: pedido PC 03273-2/26 emitido em\n16/10/2026, PIX feito em 19/10/2026 — o prazo até o vencimento em 15/11 é de <strong>27\ndias</strong>, não 30.</p>\n<h3>RN-10 — Moeda e arredondamento</h3>\n<p>Duas casas decimais, <code>ROUND_HALF_UP</code>, em todo lugar. Percentuais calculados em\n<code>NUMERIC</code> e arredondados só na exibição. Nunca comparar dinheiro com <code>=</code> em\nponto flutuante; se precisar de tolerância, use <code>0.005</code>.</p>\n<h2>5. Armadilhas reais — todas já aconteceram</h2>\n<p>Estas não são hipóteses. Cada uma apareceu nos três primeiros meses de operação e\nprecisa de tratamento explícito.</p>\n<h3>A-01 — O fornecedor lança o desconto na própria nota</h3>\n<p>A SB Indústria emite a NF já com o desconto aplicado. Resultado: <strong>o total\nimpresso do pedido não bate com a soma dos itens</strong>.</p>\n<blockquote>\n<p>Pedido PC 03273-1/26: itens 250 un × R$ 38,90 = <strong>R$ 9.725,00</strong>.\nTotal do pedido e duplicata impressos: <strong>R$ 9.327,00</strong>. Diferença: R$ 398,00.</p>\n</blockquote>\n<p>O valor cheio correto é <strong>a soma dos itens</strong> (R$ 9.725,00) — é isso que a Machado\ndevolve. Quem lê o total impresso lança a operação com prejuízo de R$ 9,00 em vez\nde lucro de R$ 389,00.</p>\n<p><strong>Tratamento:</strong> o robô de ingestão compara <code>Σ(qtd × valor_unitário)</code> com o total\nimpresso. Divergência acima de R$ 0,01 vira uma pendência explícita no rascunho,\ncom os dois números lado a lado. Nunca escolher sozinho.</p>\n<h3>A-02 — Ano errado no vencimento</h3>\n<p>O pedido PC 03273-0/26, de setembro de 2026, saiu com vencimento impresso\n<strong>06/10/2025</strong>. Um título com data no passado some dos relatórios ou aparece como\nvencido há um ano.</p>\n<p><strong>Tratamento:</strong> se <code>vencimento &lt; data_pagamento</code> ou <code>vencimento &gt; data_pagamento +\n365 dias</code>, barrar e pedir confirmação. É quase sempre o ano digitado errado.</p>\n<h3>A-03 — Quantidade do pedido ≠ quantidade da nota</h3>\n<p>No PC 03273-2/26 a quantidade do pedido era 250 un mas a entrada em estoque foi de\n<strong>110 un</strong>, e o valor cheio seguiu a quantidade entregue (110 × 38,90 =\nR$ 4.279,00).</p>\n<p><strong>Tratamento:</strong> o valor cheio vem sempre do <strong>total da duplicata</strong>, não da\nmultiplicação da quantidade pedida. A conferência de itens serve para detectar\nA-01, não para calcular o valor.</p>\n<h3>A-04 — Mais de um pedido pago no mesmo dia, com PIX separados</h3>\n<p>Em 16/09/2026 foram dois pedidos da Brislu, com dois PIX de valores diferentes\n(R$ 24.864,00 e R$ 32.313,60). Casar comprovante com pedido pela data não\nfunciona.</p>\n<p><strong>Tratamento:</strong> casar por <strong>valor</strong>. Se dois comprovantes do mesmo dia têm\nvalores diferentes, o maior pertence ao pedido de maior valor cheio. Se houver\nempate de valor, pedir a escolha.</p>\n<h3>A-05 — A taxa do fornecedor muda sem aviso</h3>\n<p>A Brislu operava a 3,00% em agosto e passou a 4,19% em setembro. O sistema não\npode ter desconto fixo por fornecedor — <code>fornecedor.desconto_padrao</code> é apenas\nsugestão de preenchimento, e o valor real vem sempre dos documentos.</p>\n<h2>6. O que o sistema deliberadamente NÃO faz</h2>\n<p>Deixar isso claro evita escopo inventado depois:</p>\n<ul>\n<li>Não emite nenhum documento fiscal.</li>\n<li>Não movimenta conta bancária nem dispara PIX.</li>\n<li>Não controla estoque, nem preço de venda, nem margem de revenda.</li>\n<li>Não é contabilidade: é controle gerencial do capital do investidor.</li>\n<li>Não decide se uma compra deve ser feita — mostra o retorno e quem decide é a\n  pessoa.</li>\n</ul>"}, {"arq": "02-modelo-dados.md", "titulo": "Modelo de dados", "sub": "DDL PostgreSQL, triggers e views", "html": "<p>PostgreSQL 15+. Para MySQL, troque <code>bigserial</code> por <code>bigint auto_increment</code>,\n<code>jsonb</code> por <code>json</code>, <code>text</code> por <code>varchar</code>, e mova os <code>check</code> para triggers.</p>\n<h2>1. Diagrama</h2>\n<pre><code>  fornecedor 1 ──&lt; operacao 1 ──&lt; duplicata\n                      │\n                      ├──&lt; documento\n                      │\n  movimento_caixa     └──&lt; evento (auditoria, polimórfico)\n\n  usuario ──&lt; operacao.criado_por, movimento_caixa.criado_por, evento.usuario_id\n  parametro (configuração: limiar de caixa parado, etc.)\n</code></pre>\n<h2>2. DDL</h2>\n<pre><code class=\"language-sql\">-- ---------------------------------------------------------------\n-- Caixa Factory — esquema inicial\n-- ---------------------------------------------------------------\ncreate schema if not exists caixa;\nset search_path to caixa, public;\n\n-- Usuários ------------------------------------------------------\ncreate table usuario (\n  id            bigserial primary key,\n  nome          text        not null,\n  email         text        not null unique,\n  senha_hash    text        not null,\n  papel         text        not null default 'operador'\n                check (papel in ('admin','operador','leitura')),\n  ativo         boolean     not null default true,\n  criado_em     timestamptz not null default now()\n);\n\n-- Fornecedores --------------------------------------------------\ncreate table fornecedor (\n  id               bigserial primary key,\n  nome             text        not null,\n  cnpj             text unique,\n  chave_pix        text,\n  desconto_padrao  numeric(6,4),          -- 0.0400 = 4%; apenas sugestão (A-05)\n  prazo_padrao     text,                  -- '30/40', '30', '28/35/42'\n  observacoes      text,\n  ativo            boolean     not null default true,\n  criado_em        timestamptz not null default now()\n);\n\ncomment on column fornecedor.desconto_padrao is\n  'Sugestão de preenchimento. O valor real vem sempre dos documentos (ver A-05).';\n\n-- Operações -----------------------------------------------------\ncreate table operacao (\n  id              bigserial primary key,\n  fornecedor_id   bigint      not null references fornecedor(id),\n  numero_pedido   text        not null,          -- 'PC 03273-2/26'\n  numero_nf       text,                          -- '12893'\n  data_pedido     date,\n  data_pagamento  date        not null,          -- inicia a contagem do prazo (RN-09)\n  valor_pago      numeric(14,2) not null check (valor_pago  &gt; 0),\n  valor_cheio     numeric(14,2) not null check (valor_cheio &gt; 0),\n  situacao        text        not null default 'confirmada'\n                  check (situacao in ('rascunho','confirmada','estornada')),\n  origem          text        not null default 'manual'\n                  check (origem in ('manual','robo','importacao')),\n  observacoes     text,\n  estornada_em    timestamptz,\n  estorno_motivo  text,\n  criado_por      bigint      references usuario(id),\n  criado_em       timestamptz not null default now(),\n  atualizado_em   timestamptz not null default now(),\n\n  constraint pago_nao_passa_do_cheio check (valor_cheio &gt;= valor_pago),  -- RN-02\n  constraint pedido_unico_por_fornecedor unique (fornecedor_id, numero_pedido)\n);\n\ncreate index on operacao (data_pagamento);\ncreate index on operacao (situacao) where situacao = 'confirmada';\n\n-- Duplicatas ----------------------------------------------------\ncreate table duplicata (\n  id            bigserial primary key,\n  operacao_id   bigint      not null references operacao(id) on delete restrict,\n  sequencia     int         not null check (sequencia &gt;= 1),\n  valor         numeric(14,2) not null check (valor &gt; 0),\n  vencimento    date        not null,\n  recebida_em   date,\n  criado_em     timestamptz not null default now(),\n\n  unique (operacao_id, sequencia)\n);\n\ncreate index on duplicata (vencimento) where recebida_em is null;\ncreate index on duplicata (operacao_id);\n\n-- Movimentos de caixa -------------------------------------------\ncreate table movimento_caixa (\n  id           bigserial primary key,\n  tipo         text        not null check (tipo in ('aporte','retirada')),\n  data         date        not null,\n  valor        numeric(14,2) not null check (valor &gt; 0),\n  observacoes  text,\n  criado_por   bigint      references usuario(id),\n  criado_em    timestamptz not null default now()\n);\n\ncreate index on movimento_caixa (data);\n\n-- Documentos ----------------------------------------------------\ncreate table documento (\n  id            bigserial primary key,\n  operacao_id   bigint      references operacao(id) on delete restrict,\n  tipo          text        not null\n                check (tipo in ('pedido_compra','comprovante_pix','nota_fiscal','outro')),\n  nome_arquivo  text        not null,      -- 2026-10-19_PC-03273-2-26_comprovante-pix.pdf\n  caminho       text        not null,      -- operacoes/2026-10/&lt;nome_arquivo&gt;\n  mime          text,\n  bytes         bigint,\n  sha256        text        unique,        -- evita subir o mesmo arquivo duas vezes\n  data_doc      date,                      -- data impressa no documento\n  enviado_em    timestamptz not null default now()\n);\n\ncreate index on documento (operacao_id);\n\n-- Auditoria -----------------------------------------------------\ncreate table evento (\n  id           bigserial primary key,\n  entidade     text        not null,   -- 'operacao','duplicata','movimento_caixa'\n  entidade_id  bigint      not null,\n  acao         text        not null,   -- 'criou','alterou','recebeu','desfez','estornou'\n  antes        jsonb,\n  depois       jsonb,\n  usuario_id   bigint      references usuario(id),\n  em           timestamptz not null default now()\n);\n\ncreate index on evento (entidade, entidade_id);\ncreate index on evento (em desc);\n\n-- Parâmetros ----------------------------------------------------\ncreate table parametro (\n  chave      text primary key,\n  valor      text not null,\n  descricao  text\n);\n\ninsert into parametro (chave, valor, descricao) values\n  ('caixa_parado_limite',  '20000.00', 'Acima disso o robô alerta (R$)'),\n  ('caixa_parado_dias',    '3',        'Dias seguidos acima do limite antes de alertar'),\n  ('alerta_destino',       '',         'Telegram chat id / e-mail para os alertas'),\n  ('dias_agenda',          '45',       'Janela da tela de próximos retornos');\n</code></pre>\n<h2>3. Triggers de integridade</h2>\n<h3>RN-01 — a soma das duplicatas tem que fechar</h3>\n<pre><code class=\"language-sql\">create or replace function caixa.valida_soma_duplicatas() returns trigger as $$\ndeclare\n  v_op    bigint := coalesce(new.operacao_id, old.operacao_id);\n  v_soma  numeric(14,2);\n  v_cheio numeric(14,2);\n  v_sit   text;\nbegin\n  select valor_cheio, situacao into v_cheio, v_sit\n    from caixa.operacao where id = v_op;\n\n  -- rascunho pode estar incompleto; confirmada não\n  if v_sit = 'rascunho' then return null; end if;\n\n  select coalesce(sum(valor),0) into v_soma\n    from caixa.duplicata where operacao_id = v_op;\n\n  if v_soma &lt;&gt; v_cheio then\n    raise exception\n      'Duplicatas somam % e o valor cheio é % (operação %)', v_soma, v_cheio, v_op;\n  end if;\n  return null;\nend $$ language plpgsql;\n\ncreate constraint trigger tg_soma_duplicatas\n  after insert or update or delete on caixa.duplicata\n  deferrable initially deferred\n  for each row execute function caixa.valida_soma_duplicatas();\n</code></pre>\n<p><code>deferrable initially deferred</code> é essencial: permite inserir a operação e as\nduplicatas na mesma transação e só validar no commit.</p>\n<h3>RN-04 — recebimento não vem antes do pagamento</h3>\n<pre><code class=\"language-sql\">create or replace function caixa.valida_recebimento() returns trigger as $$\ndeclare v_pag date;\nbegin\n  if new.recebida_em is null then return new; end if;\n  select data_pagamento into v_pag from caixa.operacao where id = new.operacao_id;\n  if new.recebida_em &lt; v_pag then\n    raise exception 'Recebimento em % é anterior ao pagamento em %', new.recebida_em, v_pag;\n  end if;\n  return new;\nend $$ language plpgsql;\n\ncreate trigger tg_valida_recebimento\n  before insert or update of recebida_em on caixa.duplicata\n  for each row execute function caixa.valida_recebimento();\n</code></pre>\n<h3>A-02 — vencimento com ano implausível</h3>\n<pre><code class=\"language-sql\">alter table caixa.duplicata add constraint vencimento_plausivel\n  check (vencimento &gt;= date '2026-01-01' and vencimento &lt;= date '2099-12-31');\n</code></pre>\n<p>A checagem fina (<code>vencimento</code> entre <code>data_pagamento</code> e <code>+365 dias</code>) fica na\naplicação, porque precisa de confirmação do usuário, não de bloqueio seco.</p>\n<h3>RN-06 — não apagar operação com recebimento</h3>\n<pre><code class=\"language-sql\">create or replace function caixa.protege_operacao() returns trigger as $$\nbegin\n  if exists (select 1 from caixa.duplicata\n             where operacao_id = old.id and recebida_em is not null) then\n    raise exception 'Operação % tem duplicata recebida: use estorno, não exclusão', old.id;\n  end if;\n  return old;\nend $$ language plpgsql;\n\ncreate trigger tg_protege_operacao\n  before delete on caixa.operacao\n  for each row execute function caixa.protege_operacao();\n</code></pre>\n<h3>Auditoria automática</h3>\n<pre><code class=\"language-sql\">create or replace function caixa.registra_evento() returns trigger as $$\nbegin\n  insert into caixa.evento (entidade, entidade_id, acao, antes, depois, usuario_id)\n  values (\n    tg_table_name,\n    coalesce(new.id, old.id),\n    lower(tg_op),\n    case when tg_op in ('UPDATE','DELETE') then to_jsonb(old) end,\n    case when tg_op in ('INSERT','UPDATE') then to_jsonb(new) end,\n    nullif(current_setting('caixa.usuario_id', true), '')::bigint\n  );\n  return coalesce(new, old);\nend $$ language plpgsql;\n\ncreate trigger tg_evento_operacao after insert or update or delete on caixa.operacao\n  for each row execute function caixa.registra_evento();\ncreate trigger tg_evento_duplicata after insert or update or delete on caixa.duplicata\n  for each row execute function caixa.registra_evento();\ncreate trigger tg_evento_movimento after insert or update or delete on caixa.movimento_caixa\n  for each row execute function caixa.registra_evento();\n</code></pre>\n<p>A API precisa fazer <code>set local caixa.usuario_id = '&lt;id&gt;'</code> no início de cada\ntransação para que o log saiba quem agiu.</p>\n<h2>4. Views de cálculo</h2>\n<p>Estas views são a implementação de referência de <a href=\"03-formulas.md\">03-formulas.md</a>.\nSe a aplicação calcular por conta própria, os resultados têm que bater com elas.</p>\n<pre><code class=\"language-sql\">-- Métricas por operação -----------------------------------------\ncreate view v_operacao as\nwith base as (\n  select o.id,\n         o.fornecedor_id, o.numero_pedido, o.numero_nf,\n         o.data_pedido, o.data_pagamento, o.valor_pago, o.valor_cheio,\n         o.situacao, o.observacoes,\n         sum(d.valor)                                                as face,\n         sum(d.valor) filter (where d.recebida_em is not null)       as recebido,\n         count(*)                                                     as qt_duplicatas,\n         count(*) filter (where d.recebida_em is null)                as qt_abertas,\n         count(*) filter (where d.recebida_em is null\n                            and d.vencimento &lt; current_date)          as qt_atrasadas,\n         -- prazo médio ponderado pelo valor de cada duplicata\n         sum(d.valor * greatest(\n               (coalesce(d.recebida_em, d.vencimento) - o.data_pagamento), 1))\n           / nullif(sum(d.valor), 0)                                  as prazo_medio\n    from operacao o\n    join duplicata d on d.operacao_id = o.id\n   where o.situacao = 'confirmada'\n   group by o.id\n)\nselect b.*,\n       coalesce(b.recebido, 0)                       as recebido_,\n       b.face - coalesce(b.recebido,0)               as aberto,\n       b.face - b.valor_pago                         as lucro,\n       (b.face - b.valor_pago) / b.valor_pago        as retorno,\n       (b.face - b.valor_pago) / b.face              as desconto,\n       power(1 + (b.face - b.valor_pago) / b.valor_pago,\n             30.0 / nullif(b.prazo_medio,0)) - 1     as taxa_mes,\n       power(1 + (b.face - b.valor_pago) / b.valor_pago,\n             365.0 / nullif(b.prazo_medio,0)) - 1    as taxa_ano,\n       case\n         when b.face - coalesce(b.recebido,0) &lt;= 0.005 then 'encerrada'\n         when coalesce(b.recebido,0) &gt; 0.005          then 'parcial'\n         when b.qt_atrasadas &gt; 0                      then 'atrasada'\n         else 'em_aberto'\n       end                                           as estado\n  from base b;\n\n-- Posição do caixa ----------------------------------------------\ncreate view v_caixa as\nwith mov as (\n  select coalesce(sum(valor) filter (where tipo='aporte'),  0) as aportes,\n         coalesce(sum(valor) filter (where tipo='retirada'),0) as retiradas\n    from movimento_caixa\n), op as (\n  select coalesce(sum(valor_pago),0)                                as pago_total,\n         coalesce(sum(recebido_),0)                                 as recebido_total,\n         coalesce(sum(valor_pago * aberto / nullif(face,0)),0)      as aplicado,\n         coalesce(sum(aberto),0)                                    as a_receber,\n         coalesce(sum(recebido_ - valor_pago * recebido_/nullif(face,0)),0) as lucro_realizado,\n         coalesce(sum(aberto   - valor_pago * aberto  /nullif(face,0)),0)   as lucro_a_receber\n    from v_operacao\n)\nselect mov.aportes, mov.retiradas,\n       mov.aportes - mov.retiradas - op.pago_total + op.recebido_total as caixa,\n       op.aplicado,\n       mov.aportes - mov.retiradas - op.pago_total + op.recebido_total\n         + op.aplicado                                                 as capital,\n       op.a_receber, op.lucro_realizado, op.lucro_a_receber\n  from mov, op;\n</code></pre>\n<blockquote>\n<p><strong>Cuidado com <code>v_operacao</code>:</strong> o <code>join duplicata</code> elimina operações sem\nduplicata. Em <code>rascunho</code> isso é esperado (a view filtra <code>confirmada</code>), mas se\num dia aparecer operação confirmada sem duplicata, ela some silenciosamente dos\ntotais. A trigger RN-01 impede esse estado; mantenha-a ativa.</p>\n</blockquote>\n<h2>5. Índices e desempenho</h2>\n<p>Com o volume real (dezenas de operações por ano), <strong>nenhuma otimização é\nnecessária</strong>. Os índices do DDL já são mais do que suficientes. Se um dia a\ntabela passar de 100 mil duplicatas, materialize <code>v_operacao</code>; antes disso, não.</p>\n<h2>6. Retenção</h2>\n<p>Nada expira. <code>evento</code> cresce devagar (algumas dezenas de linhas por mês) e é a\núnica defesa contra \"mas eu não mexi nisso\". Mantenha indefinidamente.</p>"}, {"arq": "03-formulas.md", "titulo": "Fórmulas", "sub": "Todo o cálculo, conferido nos dados reais", "html": "<p>Todas as fórmulas deste documento estão conferidas contra os dados reais de\n19/10/2026 (<a href=\"seed/estado-2026-10-19.json\">seed/estado-2026-10-19.json</a>). Use os\nexemplos como casos de teste.</p>\n<p>Notação: <code>pago</code> = <code>operacao.valor_pago</code>, <code>face</code> = <code>operacao.valor_cheio</code>.</p>\n<hr />\n<h2>1. Por operação</h2>\n<pre><code>face      = Σ duplicata.valor\nrecebido  = Σ duplicata.valor  onde recebida_em is not null\naberto    = face − recebido\nlucro     = face − pago\n\nretorno   = lucro / pago          ← a taxa do investidor (sempre esta na tela)\ndesconto  = lucro / face          ← a taxa do fornecedor (secundária)\n</code></pre>\n<h3>Prazo médio</h3>\n<p>Ponderado pelo valor de cada duplicata. A data de fim é o <strong>recebimento real</strong>\nquando existe, senão o vencimento previsto:</p>\n<pre><code>fim(d)      = d.recebida_em ?? d.vencimento\ndias(d)     = max(1, fim(d) − operacao.data_pagamento)      em dias corridos\nprazo_medio = Σ (d.valor × dias(d)) / face\n</code></pre>\n<h3>Taxas equivalentes</h3>\n<p>Juros compostos, base 30 dias para o mês e 365 para o ano:</p>\n<pre><code>taxa_mes = (1 + retorno)^(30  / prazo_medio) − 1\ntaxa_ano = (1 + retorno)^(365 / prazo_medio) − 1\nlucro_mes_em_reais = pago × taxa_mes\n</code></pre>\n<h3>Exemplo conferido — PC 03282-2/26 (Brislu)</h3>\n<pre><code>pago  = 63.321,60\nduplicatas: 32.640,00 em 26/09  e  32.640,00 em 06/10\ndata_pagamento = 27/08/2026\n\nface     = 65.280,00\nlucro    = 65.280,00 − 63.321,60 = 1.958,40\nretorno  = 1.958,40 / 63.321,60  = 0,030928  → 3,09%\ndesconto = 1.958,40 / 65.280,00  = 0,030000  → 3,00%\n\ndias(1)  = 26/09 − 27/08 = 30\ndias(2)  = 06/10 − 27/08 = 40\nprazo    = (32.640×30 + 32.640×40) / 65.280 = 35,0 dias\n\ntaxa_mes = 1,030928^(30/35) − 1 = 0,026452 → 2,65%\ntaxa_ano = 1,030928^(365/35) − 1 = 0,3738  → 37,4%\nlucro_mes = 63.321,60 × 0,026452 = 1.674,96\n</code></pre>\n<h3>Exemplo conferido — PC 03273-2/26 (SB), prazo curto</h3>\n<pre><code>pago = 4.107,84 · duplicata única 4.279,00 em 15/11 · pagamento 19/10\n\nlucro    = 171,16\nretorno  = 171,16 / 4.107,84 = 0,041667 → 4,17%\ndesconto = 171,16 / 4.279,00 = 0,040000 → 4,00%\nprazo    = 15/11 − 19/10 = 27 dias\ntaxa_mes = 1,041667^(30/27) − 1 = 0,046402 → 4,64%\n</code></pre>\n<p>Repare: mesmo desconto de 4% da operação anterior da SB, mas 27 dias em vez de\n30 — e a taxa mensal sobe de 4,17% para 4,64%. <strong>Prazo curto vale tanto quanto\ndesconto alto</strong>, e o sistema precisa deixar isso visível.</p>\n<hr />\n<h2>2. Posição do caixa</h2>\n<pre><code>aportes    = Σ movimento_caixa.valor  onde tipo = 'aporte'\nretiradas  = Σ movimento_caixa.valor  onde tipo = 'retirada'\n\ncaixa      = aportes − retiradas − Σ pago(todas) + Σ recebido(todas)\naplicado   = Σ ( pago × aberto / face )        ← capital ainda na rua\ncapital    = caixa + aplicado\na_receber  = Σ aberto\n</code></pre>\n<p>A identidade que serve de <strong>teste de regressão</strong>:</p>\n<pre><code>caixa + aplicado  ==  aportes − retiradas + lucro_realizado\n</code></pre>\n<p>Se esses dois lados divergirem em qualquer momento, há bug. Rode como asserção\nem teste automatizado.</p>\n<h3>Lucro realizado e a receber</h3>\n<p>O custo de cada operação é recuperado na mesma proporção do que já voltou:</p>\n<pre><code>custo_recuperado = pago × recebido / face\nlucro_realizado  = Σ ( recebido − custo_recuperado )\nlucro_a_receber  = Σ ( aberto   − pago × aberto / face )\n</code></pre>\n<h3>Exemplo conferido — posição em 19/10/2026</h3>\n<pre><code>aportes      = 150.000,00   (100.000 em 28/08 + 50.000 em 16/09)\nretiradas    = 0\nΣ pago       = 151.194,24\nΣ recebido   = 113.004,56   (7 duplicatas)\n\ncaixa        = 150.000 − 0 − 151.194,24 + 113.004,56 = 111.810,32  ✓\naplicado     =  43.843,56 − 1.810,92 = 42.032,64\na_receber    =  43.843,56   (4 duplicatas em aberto)\nlucro_realizado =  3.842,96\nlucro_a_receber =  1.810,92\n\nconferência: 111.810,32 + 42.032,64 = 153.842,96\n             150.000,00 + 3.842,96  = 153.842,96   ✓\n</code></pre>\n<hr />\n<h2>3. Rentabilidade da carteira</h2>\n<p>Média ponderada pelo capital de cada operação:</p>\n<pre><code>pago_total   = Σ pago\nlucro_total  = Σ lucro\nprazo_medio_carteira = Σ ( pago × prazo_medio(op) ) / pago_total\n\nretorno_carteira = lucro_total / pago_total\ntaxa_mes         = (1 + retorno_carteira)^(30 / prazo_medio_carteira) − 1\nlucro_mes_reais  = Σ ( pago(op) × taxa_mes(op) )     ← soma das operações, não da média\n</code></pre>\n<h3>Ocupação e rendimento efetivo</h3>\n<pre><code>ocupacao = aplicado / capital\nrendimento_do_caixa_inteiro = taxa_mes × ocupacao\n</code></pre>\n<p>Esta é a métrica mais importante do sistema. Em 19/10/2026 as operações rendiam\n<strong>3,26% ao mês</strong>, mas com apenas 27,3% do capital girando, o caixa inteiro rendia\n<strong>0,89% ao mês</strong> — abaixo do CDI. A carteira estava ótima e o resultado, ruim.</p>\n<hr />\n<h2>4. Agenda de retornos</h2>\n<pre><code>agenda = todas as duplicatas com recebida_em is null,\n         ordenadas por vencimento asc\n\natrasada(d) = d.vencimento &lt; hoje\n</code></pre>\n<hr />\n<h2>5. Resultado por mês (competência)</h2>\n<p>A parte mais sutil do sistema, e a que responde \"quanto o dinheiro parado me\ncustou neste mês\".</p>\n<h3>Princípio</h3>\n<p>O lucro de uma operação não pertence ao mês da compra: pertence aos dias em que o\ndinheiro esteve na rua. Uma compra paga em 16/09 com duplicata em 26/10 tem 40\ndias de duração — 14 caem em setembro e 26 em outubro, e o lucro se divide na\nmesma proporção.</p>\n<h3>Algoritmo</h3>\n<p>Para o mês <code>M</code>, com <code>ini</code> = primeiro dia, <code>fim</code> = último dia, <code>nDias</code> = dias do mês:</p>\n<pre><code>lucro_mes   = 0\ncapital_dia = 0\n\npara cada operação confirmada:\n    face  = Σ duplicatas\n    lucro = face − pago\n    para cada duplicata d:\n        fim_d = d.recebida_em ?? d.vencimento\n        n     = max(1, fim_d − data_pagamento)              # duração em dias\n\n        # janela de apropriação: (data_pagamento, fim_d]\n        a = max(data_pagamento + 1 dia, ini)\n        b = min(fim_d, fim)\n        overlap = (b − a) + 1\n        se overlap &lt;= 0: continua\n        overlap = min(overlap, n)\n\n        lucro_mes   += lucro × (d.valor / face) × (overlap / n)\n        capital_dia += pago  × (d.valor / face) × overlap\n</code></pre>\n<p>Capital total médio no mês, dia a dia:</p>\n<pre><code>capital_total_dia = 0\npara cada dia do mês:\n    saldo = Σ movimentos com data &lt;= dia   (aporte +, retirada −)\n    capital_total_dia += saldo\n</code></pre>\n<p>Resultados:</p>\n<pre><code>aplicado_medio = capital_dia / nDias\ncapital_medio  = capital_total_dia / nDias\nparado         = max(0, capital_medio − aplicado_medio)\nocupacao       = aplicado_medio / capital_medio\n\ntaxa_do_mes         = (lucro_mes / aplicado_medio) × (30 / nDias)\ntaxa_sobre_o_total  = (lucro_mes / capital_medio)  × (30 / nDias)\n\ncusto_do_parado = parado × (lucro_mes / aplicado_medio)\n</code></pre>\n<p><code>custo_do_parado</code> é o número que o usuário pediu: <strong>quanto o dinheiro parado\ndeixou de render naquele mês</strong>, na mesma taxa que o dinheiro aplicado rendeu.\nNão é uma perda contábil — é custo de oportunidade, e deve ser rotulado como\n\"deixou de ganhar\", nunca como \"prejuízo\".</p>\n<h3>Exemplos conferidos</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mês</th>\n<th>Lucro</th>\n<th>Aplicado médio</th>\n<th>Parado médio</th>\n<th>Deixou de ganhar</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ago/2026</td>\n<td>249,90</td>\n<td>8.936,52</td>\n<td>3.966,71</td>\n<td>110,92</td>\n</tr>\n<tr>\n<td>Set/2026</td>\n<td>3.200,32</td>\n<td>103.260,88</td>\n<td>21.739,12</td>\n<td>673,75</td>\n</tr>\n<tr>\n<td>Out/2026</td>\n<td>2.108,57</td>\n<td>56.379,73</td>\n<td>93.620,27</td>\n<td>3.501,35</td>\n</tr>\n<tr>\n<td>Nov/2026</td>\n<td>95,09</td>\n<td>2.053,92</td>\n<td>147.946,08</td>\n<td>6.849,36</td>\n</tr>\n</tbody>\n</table></div>\n<p>Agosto parece pequeno porque a operação começou em 27/08: só 4 dias do mês\ntiveram dinheiro na rua.</p>\n<h3>Meses em aberto</h3>\n<p>Um mês cujo último dia ainda não passou mistura realizado com contratado. A tela\nprecisa marcar: <code>mês em curso</code> quando <code>fim &gt;= hoje &gt; ini</code>, e <code>projeção</code> quando\n<code>ini &gt; hoje</code>. Os números mudam a cada compra nova.</p>\n<hr />\n<h2>6. Casos de borda</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Caso</th>\n<th>Comportamento esperado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>face == pago</code></td>\n<td>lucro 0, retorno 0, taxas 0. Permitido, com aviso na tela.</td>\n</tr>\n<tr>\n<td><code>prazo_medio == 0</code></td>\n<td>Impossível: <code>dias</code> tem piso de 1.</td>\n</tr>\n<tr>\n<td>Duplicata recebida no mesmo dia do pagamento</td>\n<td><code>dias = 1</code>. Taxa mensal fica enorme — correto, mas a tela deve mostrar \"menos de 1 dia\" em vez de \"1200% a.m.\".</td>\n</tr>\n<tr>\n<td>Operação sem duplicata</td>\n<td>Só em <code>rascunho</code>. Views e totais ignoram.</td>\n</tr>\n<tr>\n<td>Mês sem nenhuma operação ativa</td>\n<td><code>lucro_mes = 0</code>, <code>aplicado_medio = 0</code>, <code>taxa = 0</code>. Dividir por zero → retorne 0, não <code>NaN</code>.</td>\n</tr>\n<tr>\n<td>Capital total zero (antes do 1º aporte)</td>\n<td><code>ocupacao = 0</code>.</td>\n</tr>\n<tr>\n<td>Recebimento desfeito</td>\n<td>O valor sai do caixa, a duplicata volta a <code>aberta</code>, o lucro realizado diminui. Tudo recalculado, nada guardado.</td>\n</tr>\n<tr>\n<td>Operação estornada</td>\n<td>Sai de todos os cálculos como se não existisse, mas permanece na tabela e no log.</td>\n</tr>\n<tr>\n<td>Duas operações com o mesmo <code>numero_pedido</code></td>\n<td>Bloqueado por unique <code>(fornecedor_id, numero_pedido)</code>. Pedidos diferentes do mesmo número base têm sufixo: <code>03273-0/26</code>, <code>03273-1/26</code>, <code>03273-2/26</code>.</td>\n</tr>\n</tbody>\n</table></div>"}, {"arq": "04-api.md", "titulo": "API", "sub": "Endpoints REST, payloads e erros", "html": "<p>Base: <code>https://&lt;dominio&gt;/api/v1</code>. Tudo em JSON, UTF-8.</p>\n<h2>1. Convenções</h2>\n<p><strong>Dinheiro</strong> trafega como <strong>string decimal</strong> com duas casas: <code>\"9336.00\"</code>. Nunca\nnúmero JSON — <code>9336.00</code> vira <code>9336</code> e <code>0.1+0.2</code> vira <code>0.30000000000000004</code>. O\ncliente converte para <code>Decimal</code>/<code>BigDecimal</code>, nunca para <code>float</code>.</p>\n<p><strong>Datas de negócio</strong> em <code>YYYY-MM-DD</code>, sem hora. <strong>Timestamps</strong> de auditoria em\nISO-8601 com fuso: <code>2026-10-19T16:35:48-03:00</code>.</p>\n<p><strong>Percentuais</strong> como fração decimal em string: <code>\"0.041667\"</code> para 4,1667%. A\nformatação (<code>4,17%</code>) é responsabilidade da tela.</p>\n<p><strong>Autenticação:</strong> <code>Authorization: Bearer &lt;token&gt;</code>. Token de sessão para a tela,\ntoken de serviço para o robô — com papel <code>operador</code>, nunca <code>admin</code>.</p>\n<p><strong>Idempotência:</strong> todo <code>POST</code> que cria dinheiro aceita o header\n<code>Idempotency-Key: &lt;uuid&gt;</code>. Repetir a chamada com a mesma chave em até 24h devolve\na resposta original sem criar nada novo. Isso evita operação duplicada quando o\nrobô tenta de novo após timeout.</p>\n<p><strong>Erros:</strong></p>\n<pre><code class=\"language-json\">{\n  &quot;erro&quot;: {\n    &quot;codigo&quot;: &quot;caixa_insuficiente&quot;,\n    &quot;mensagem&quot;: &quot;Caixa insuficiente: você tem R$ 2.913,60 livre.&quot;,\n    &quot;detalhe&quot;: { &quot;disponivel&quot;: &quot;2913.60&quot;, &quot;solicitado&quot;: &quot;4107.84&quot; }\n  }\n}\n</code></pre>\n<p>Códigos: <code>nao_autenticado</code> 401 · <code>sem_permissao</code> 403 · <code>nao_encontrado</code> 404 ·\n<code>validacao</code> 422 · <code>caixa_insuficiente</code> 422 · <code>soma_duplicatas</code> 422 ·\n<code>conflito</code> 409 · <code>erro_interno</code> 500.</p>\n<hr />\n<h2>2. Resumo e painéis</h2>\n<h3><code>GET /resumo</code></h3>\n<p>Alimenta os cartões do topo da tela.</p>\n<pre><code class=\"language-json\">{\n  &quot;caixa&quot;: &quot;111810.32&quot;,\n  &quot;aplicado&quot;: &quot;42032.64&quot;,\n  &quot;capital&quot;: &quot;153842.96&quot;,\n  &quot;a_receber&quot;: &quot;43843.56&quot;,\n  &quot;lucro_realizado&quot;: &quot;3842.96&quot;,\n  &quot;lucro_a_receber&quot;: &quot;1810.92&quot;,\n  &quot;duplicatas_abertas&quot;: 4,\n  &quot;operacoes_abertas&quot;: 4,\n  &quot;rentabilidade&quot;: {\n    &quot;retorno&quot;: &quot;0.037402&quot;,\n    &quot;prazo_medio_dias&quot;: &quot;33.6&quot;,\n    &quot;taxa_mes&quot;: &quot;0.032600&quot;,\n    &quot;taxa_ano&quot;: &quot;0.478000&quot;,\n    &quot;lucro_mes_reais&quot;: &quot;4965.73&quot;,\n    &quot;ocupacao&quot;: &quot;0.273000&quot;,\n    &quot;rendimento_caixa_inteiro&quot;: &quot;0.008900&quot;\n  }\n}\n</code></pre>\n<h3><code>GET /resultado-mensal?de=2026-08&amp;ate=2026-12</code></h3>\n<p>Alimenta o painel \"Resultado por mês\". <code>de</code>/<code>ate</code> opcionais — o padrão cobre do\nprimeiro movimento até o último vencimento.</p>\n<pre><code class=\"language-json\">{\n  &quot;meses&quot;: [\n    {\n      &quot;mes&quot;: &quot;2026-10&quot;,\n      &quot;dias&quot;: 31,\n      &quot;estado&quot;: &quot;fechado&quot;,\n      &quot;lucro&quot;: &quot;2108.57&quot;,\n      &quot;aplicado_medio&quot;: &quot;56379.73&quot;,\n      &quot;capital_medio&quot;: &quot;150000.00&quot;,\n      &quot;parado_medio&quot;: &quot;93620.27&quot;,\n      &quot;ocupacao&quot;: &quot;0.376000&quot;,\n      &quot;taxa_mes&quot;: &quot;0.036200&quot;,\n      &quot;taxa_sobre_total&quot;: &quot;0.014100&quot;,\n      &quot;custo_do_parado&quot;: &quot;3501.35&quot;\n    }\n  ]\n}\n</code></pre>\n<p><code>estado</code>: <code>fechado</code> · <code>em_curso</code> · <code>projecao</code>.</p>\n<h3><code>GET /agenda?dias=45</code></h3>\n<pre><code class=\"language-json\">{\n  &quot;duplicatas&quot;: [\n    {\n      &quot;id&quot;: 12,\n      &quot;operacao_id&quot;: 5,\n      &quot;fornecedor&quot;: &quot;Brislu Plásticos&quot;,\n      &quot;numero_pedido&quot;: &quot;PC 03295-5/26&quot;,\n      &quot;sequencia&quot;: 2, &quot;de&quot;: 2,\n      &quot;valor&quot;: &quot;12975.90&quot;,\n      &quot;vencimento&quot;: &quot;2026-10-26&quot;,\n      &quot;atrasada&quot;: false\n    }\n  ],\n  &quot;total&quot;: &quot;43843.56&quot;\n}\n</code></pre>\n<hr />\n<h2>3. Operações</h2>\n<h3><code>GET /operacoes</code></h3>\n<p>Filtros: <code>estado</code> (<code>em_aberto|parcial|encerrada|atrasada|rascunho|estornada</code>),\n<code>fornecedor_id</code>, <code>q</code> (busca em pedido, NF e observações), <code>de</code>, <code>ate</code>,\n<code>pagina</code>, <code>por_pagina</code> (padrão 50).</p>\n<pre><code class=\"language-json\">{\n  &quot;itens&quot;: [\n    {\n      &quot;id&quot;: 7,\n      &quot;fornecedor&quot;: { &quot;id&quot;: 2, &quot;nome&quot;: &quot;SB Indústria e Comércio de Papel&quot; },\n      &quot;numero_pedido&quot;: &quot;PC 03273-2/26&quot;,\n      &quot;numero_nf&quot;: &quot;12893&quot;,\n      &quot;data_pedido&quot;: &quot;2026-10-16&quot;,\n      &quot;data_pagamento&quot;: &quot;2026-10-19&quot;,\n      &quot;valor_pago&quot;: &quot;4107.84&quot;,\n      &quot;valor_cheio&quot;: &quot;4279.00&quot;,\n      &quot;lucro&quot;: &quot;171.16&quot;,\n      &quot;retorno&quot;: &quot;0.041667&quot;,\n      &quot;desconto&quot;: &quot;0.040000&quot;,\n      &quot;prazo_medio_dias&quot;: &quot;27.0&quot;,\n      &quot;taxa_mes&quot;: &quot;0.046402&quot;,\n      &quot;lucro_mes_reais&quot;: &quot;190.61&quot;,\n      &quot;estado&quot;: &quot;em_aberto&quot;,\n      &quot;observacoes&quot;: &quot;Papel acoplado mono 32×37 · 110 un&quot;,\n      &quot;duplicatas&quot;: [\n        { &quot;id&quot;: 11, &quot;sequencia&quot;: 1, &quot;valor&quot;: &quot;4279.00&quot;,\n          &quot;vencimento&quot;: &quot;2026-11-15&quot;, &quot;recebida_em&quot;: null }\n      ],\n      &quot;documentos&quot;: [\n        { &quot;id&quot;: 20, &quot;tipo&quot;: &quot;pedido_compra&quot;,\n          &quot;nome_arquivo&quot;: &quot;2026-10-16_PC-03273-2-26_pedido-compra.png&quot; }\n      ]\n    }\n  ],\n  &quot;total&quot;: 7, &quot;pagina&quot;: 1\n}\n</code></pre>\n<h3><code>POST /operacoes</code></h3>\n<pre><code class=\"language-json\">{\n  &quot;fornecedor_id&quot;: 2,\n  &quot;numero_pedido&quot;: &quot;PC 03273-2/26&quot;,\n  &quot;numero_nf&quot;: &quot;12893&quot;,\n  &quot;data_pedido&quot;: &quot;2026-10-16&quot;,\n  &quot;data_pagamento&quot;: &quot;2026-10-19&quot;,\n  &quot;valor_pago&quot;: &quot;4107.84&quot;,\n  &quot;valor_cheio&quot;: &quot;4279.00&quot;,\n  &quot;observacoes&quot;: &quot;Papel acoplado mono 32×37 · 110 un&quot;,\n  &quot;duplicatas&quot;: [\n    { &quot;valor&quot;: &quot;4279.00&quot;, &quot;vencimento&quot;: &quot;2026-11-15&quot; }\n  ],\n  &quot;documento_ids&quot;: [20, 21]\n}\n</code></pre>\n<p>Validações, nesta ordem, parando na primeira falha:</p>\n<ol>\n<li>fornecedor existe e está ativo</li>\n<li><code>valor_pago &gt; 0</code>, <code>valor_cheio &gt; 0</code></li>\n<li><code>valor_cheio &gt;= valor_pago</code> → <code>validacao</code></li>\n<li>pelo menos uma duplicata, todas com valor &gt; 0 e vencimento preenchido</li>\n<li><code>Σ duplicatas == valor_cheio</code> → <code>soma_duplicatas</code></li>\n<li>cada <code>vencimento &gt;= data_pagamento</code> e <code>&lt;= data_pagamento + 365d</code> → <code>validacao</code>\n   (ver A-02)</li>\n<li><code>valor_pago &lt;= caixa_disponivel</code> → <code>caixa_insuficiente</code></li>\n</ol>\n<p>A sequência das duplicatas é atribuída pelo servidor, ordenando por vencimento.</p>\n<p><code>201 Created</code> com o objeto completo.</p>\n<h3><code>PATCH /operacoes/:id</code></h3>\n<p>Campos alteráveis: todos, inclusive a lista de duplicatas (substituição\ncompleta). Duplicata já recebida não pode ter o valor alterado — só o\nvencimento, e com aviso. Na revalidação do caixa, o disponível é\n<code>caixa + valor_pago_atual − recebido_desta_operacao</code> (RN-03).</p>\n<h3><code>POST /operacoes/:id/estorno</code></h3>\n<pre><code class=\"language-json\">{ &quot;motivo&quot;: &quot;Pedido cancelado pelo fornecedor&quot; }\n</code></pre>\n<p>Marca <code>situacao = 'estornada'</code>, registra em <code>evento</code>. A operação sai de todos os\ncálculos. Não apaga nada. <code>409 conflito</code> se já estiver estornada.</p>\n<h3><code>DELETE /operacoes/:id</code></h3>\n<p>Só funciona em <code>rascunho</code> ou em operação confirmada sem nenhum recebimento.\nCaso contrário <code>409 conflito</code> com a mensagem apontando o estorno.</p>\n<hr />\n<h2>4. Recebimentos</h2>\n<h3><code>POST /duplicatas/:id/receber</code></h3>\n<pre><code class=\"language-json\">{ &quot;data&quot;: &quot;2026-10-26&quot; }\n</code></pre>\n<p><code>data</code> opcional; o padrão é hoje. Valida RN-04. <code>409</code> se já recebida.</p>\n<h3><code>DELETE /duplicatas/:id/receber</code></h3>\n<p>Desfaz. O valor sai do caixa, a duplicata volta a aberta, o lucro realizado\ndiminui. Fica registrado em <code>evento</code> com ação <code>desfez</code>.</p>\n<h3><code>POST /duplicatas/receber-lote</code></h3>\n<p>Para o caso comum de várias duplicatas caindo juntas:</p>\n<pre><code class=\"language-json\">{ &quot;itens&quot;: [ { &quot;id&quot;: 8, &quot;data&quot;: &quot;2026-10-26&quot; }, { &quot;id&quot;: 9, &quot;data&quot;: &quot;2026-10-26&quot; } ] }\n</code></pre>\n<p>Tudo numa transação: ou todas entram, ou nenhuma.</p>\n<hr />\n<h2>5. Caixa</h2>\n<h3><code>GET /movimentos</code> · <code>POST /movimentos</code></h3>\n<pre><code class=\"language-json\">{ &quot;tipo&quot;: &quot;aporte&quot;, &quot;data&quot;: &quot;2026-09-16&quot;, &quot;valor&quot;: &quot;50000.00&quot;,\n  &quot;observacoes&quot;: &quot;Aporte para as compras da Brislu de setembro&quot; }\n</code></pre>\n<p>Retirada valida RN-05 contra o caixa disponível.</p>\n<h3><code>DELETE /movimentos/:id</code></h3>\n<p>Permitido só se o caixa continuar não-negativo em toda a linha do tempo depois\nda remoção. Senão <code>422</code>.</p>\n<hr />\n<h2>6. Fornecedores</h2>\n<p><code>GET /fornecedores</code> · <code>POST /fornecedores</code> · <code>PATCH /fornecedores/:id</code></p>\n<pre><code class=\"language-json\">{ &quot;nome&quot;: &quot;SB Indústria e Comércio de Papel&quot;, &quot;cnpj&quot;: &quot;26107828000137&quot;,\n  &quot;chave_pix&quot;: &quot;sbindustria33@gmail.com&quot;, &quot;desconto_padrao&quot;: &quot;0.0400&quot;,\n  &quot;prazo_padrao&quot;: &quot;30&quot;,\n  &quot;observacoes&quot;: &quot;Lança o desconto na própria nota — conferir soma dos itens (A-01)&quot; }\n</code></pre>\n<p>O campo <code>observacoes</code> do fornecedor aparece como aviso na tela de lançamento.\nÉ onde mora a memória institucional das armadilhas.</p>\n<hr />\n<h2>7. Documentos</h2>\n<h3><code>POST /documentos</code> — <code>multipart/form-data</code></h3>\n<p>Campos: <code>arquivo</code>, <code>tipo</code>, <code>operacao_id</code> (opcional), <code>data_doc</code> (opcional).</p>\n<p>O servidor calcula o <code>sha256</code>; se já existir, devolve <code>200</code> com o documento\nexistente em vez de duplicar. Renomeia conforme a convenção:</p>\n<pre><code>AAAA-MM-DD_PC-&lt;pedido com - no lugar de / e espaço&gt;_&lt;tipo&gt;.&lt;ext&gt;\n2026-10-19_PC-03273-2-26_comprovante-pix.pdf\n</code></pre>\n<p>Grava em <code>operacoes/AAAA-MM/</code> relativo à raiz de documentos.</p>\n<h3><code>GET /documentos/:id/arquivo</code></h3>\n<p>Devolve o binário com <code>Content-Disposition: inline</code>.</p>\n<hr />\n<h2>8. Exportação</h2>\n<h3><code>GET /exportar/operacoes.csv</code></h3>\n<p>Uma linha <strong>por duplicata</strong>, com os dados da operação repetidos — é o formato que\na planilha e o contador já usam. Separador <code>;</code>, decimal com vírgula, BOM UTF-8\npara o Excel brasileiro abrir certo.</p>\n<p>Colunas, nesta ordem:</p>\n<pre><code>Data compra;Fornecedor;NF/Pedido;Valor cheio;Valor pago;Lucro total;\nRetorno % s/ valor pago;Desconto % s/ valor cheio;Prazo (dias);% ao mes;\nLucro por mes;Parcela;Valor parcela;Vencimento;Recebida em;Situacao;Observacoes\n</code></pre>\n<h3><code>GET /exportar/movimentos.csv</code></h3>\n<pre><code>Data;Tipo;Valor;Observacoes\n</code></pre>\n<hr />\n<h2>9. Endpoints do robô</h2>\n<p>Descritos em detalhe em <a href=\"06-robo.md\">06-robo.md</a>.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Rota</th>\n<th>O que faz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>POST</code></td>\n<td><code>/robo/ingestao</code></td>\n<td>Recebe documentos, devolve rascunho de operação</td>\n</tr>\n<tr>\n<td><code>GET</code></td>\n<td><code>/robo/rascunhos</code></td>\n<td>Fila de rascunhos aguardando conferência</td>\n</tr>\n<tr>\n<td><code>POST</code></td>\n<td><code>/robo/rascunhos/:id/aprovar</code></td>\n<td>Confirma, opcionalmente com correções</td>\n</tr>\n<tr>\n<td><code>POST</code></td>\n<td><code>/robo/rascunhos/:id/descartar</code></td>\n<td>Arquiva sem criar operação</td>\n</tr>\n<tr>\n<td><code>POST</code></td>\n<td><code>/robo/conciliacao</code></td>\n<td>Roda a varredura de vencimentos (cron)</td>\n</tr>\n<tr>\n<td><code>GET</code></td>\n<td><code>/robo/alertas</code></td>\n<td>Alertas abertos</td>\n</tr>\n<tr>\n<td><code>POST</code></td>\n<td><code>/robo/alertas/:id/baixar</code></td>\n<td>Marca como lido</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h2>10. Saúde</h2>\n<h3><code>GET /saude</code></h3>\n<pre><code class=\"language-json\">{ &quot;ok&quot;: true, &quot;versao&quot;: &quot;1.0.3&quot;, &quot;banco&quot;: &quot;ok&quot;,\n  &quot;integridade&quot;: { &quot;identidade_caixa&quot;: &quot;ok&quot; } }\n</code></pre>\n<p><code>integridade.identidade_caixa</code> roda a asserção\n<code>caixa + aplicado == aportes − retiradas + lucro_realizado</code>. Se falhar, o sistema\nestá com os números errados e isso precisa aparecer no monitoramento, não só nos\ntestes.</p>"}, {"arq": "05-telas.md", "titulo": "Telas", "sub": "Comportamento da interface", "html": "<p>A página em uso hoje já é a especificação visual validada. Este documento\ndescreve o comportamento que o programador precisa preservar; o HTML/CSS pode ser\nreaproveitado quase inteiro, trocando o estado embutido por chamadas à API.</p>\n<h2>1. Mapa das telas</h2>\n<pre><code>/                 Painel (tudo numa página, rolagem vertical)\n  ├─ faixa superior: título + status de gravação + ações\n  ├─ 4 cartões de posição\n  ├─ Rentabilidade do dinheiro (4 indicadores)\n  ├─ Resultado por mês (seletor + barras + 4 indicadores)\n  ├─ A conferir (só aparece se houver pendência)\n  ├─ Próximos retornos (agenda)\n  ├─ Operações (tabela + filtros + busca + exportar)\n  ├─ Aportes e retiradas (tabela)\n  └─ nota explicativa do método\n\n/entrar           Login\n/fornecedores     Cadastro (tela simples, pouco usada)\n/historico        Log de eventos (auditoria)\n</code></pre>\n<p>Tudo numa página é deliberado: o dono olha o painel inteiro de uma vez, no\ncelular ou no painel lateral do Claude, que tem cerca de 680px de largura.\n<strong>Testar nessa largura é obrigatório.</strong></p>\n<h2>2. Painel — os quatro cartões de posição</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cartão</th>\n<th>Valor</th>\n<th>Linha de apoio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Caixa disponível</strong> (destaque, maior)</td>\n<td><code>caixa</code></td>\n<td>\"livre para novas compras\" + barra caixa/aplicado + legenda com capital total</td>\n</tr>\n<tr>\n<td>A receber da empresa</td>\n<td><code>a_receber</code></td>\n<td>\"N parcelas em aberto · M operações\"</td>\n</tr>\n<tr>\n<td>Lucro realizado</td>\n<td><code>lucro_realizado</code></td>\n<td>\"média de X% sobre o valor pago\"</td>\n</tr>\n<tr>\n<td>Lucro a receber</td>\n<td><code>lucro_a_receber</code></td>\n<td>\"desconto embutido no que ainda está na rua\"</td>\n</tr>\n</tbody>\n</table></div>\n<p>Regras:</p>\n<ul>\n<li>Caixa negativo em vermelho. Não deveria acontecer (RN-03), mas se acontecer\n  tem que gritar.</li>\n<li>A barra é empilhada: azul = caixa, âmbar = aplicado, proporcionais ao capital.</li>\n<li>No painel estreito os três cartões menores ficam <strong>lado a lado numa linha</strong>.\n  Um cartão sozinho com espaço vazio ao lado é lido como \"não carregou\" — isso\n  já foi reportado como bug pelo usuário.</li>\n</ul>\n<h2>3. Rentabilidade do dinheiro</h2>\n<p>Quatro indicadores em linha:</p>\n<ol>\n<li><strong>Retorno sobre o que você paga</strong> — <code>taxa_mes</code> ao mês; apoio: <code>retorno</code> em N\n   dias, equivalente a <code>taxa_ano</code> ao ano</li>\n<li><strong>Lucro por mês</strong> — <code>lucro_mes_reais</code>; apoio: lucro total</li>\n<li><strong>Capital em uso</strong> — <code>ocupacao</code>; apoio: \"o restante fica parado no caixa, sem\n   render\"</li>\n<li><strong>Rendimento do caixa inteiro</strong> (destacado) — <code>rendimento_caixa_inteiro</code></li>\n</ol>\n<p>O quarto é o mais importante e por isso tem fundo próprio.</p>\n<h2>4. Resultado por mês</h2>\n<p>O seletor tem <strong>três formas de uso</strong>, todas obrigatórias:</p>\n<ul>\n<li>clicar numa barra</li>\n<li>escolher na lista suspensa</li>\n<li>setas ‹ › para o mês anterior/seguinte (desabilitadas nas pontas)</li>\n</ul>\n<p>As barras são uma série só, altura proporcional ao maior lucro do período,\nmínimo 2px para o mês não sumir. O valor aparece no topo da barra <strong>apenas no\nmês selecionado e no hover</strong> — número em toda barra polui. Rótulo do mês\nabreviado embaixo, sempre visível.</p>\n<p>Indicadores do mês escolhido: <strong>Lucro do mês · Aplicado no mês · Ficou parado ·\nDeixou de ganhar</strong> (destacado, em vermelho).</p>\n<p>Um selo ao lado do título marca <code>mês em curso</code> ou <code>projeção</code>, e a nota de rodapé\navisa que os números ainda vão mudar.</p>\n<p>O mês selecionado é estado de interface por visitante — não grava no servidor.</p>\n<h2>5. Tabela de operações</h2>\n<p>Colunas: <strong>Compra</strong> (data + selo de estado) · <strong>Fornecedor</strong> (nome, pedido/NF,\nobservações) · <strong>Valor cheio</strong> · <strong>Paguei</strong> · <strong>Lucro</strong> · <strong>Retorno em\nduplicatas</strong> · ações.</p>\n<p>A célula de lucro tem três linhas:</p>\n<pre><code>R$ 171,16                        ← lucro, verde (vermelho se negativo)\nR$ 190,61 por mês                ← lucro mensal em reais\n4,17% sobre o que paguei · 4,64% a.m.\ndesconto de 4,00% no valor cheio ← cinza, secundário\n</code></pre>\n<p>Essa hierarquia é o cumprimento de RN-07 na tela: o retorno em cima, o desconto\nembaixo e apagado.</p>\n<p><strong>Duplicatas como botões.</strong> Cada duplicata é um botão clicável dentro da linha:</p>\n<pre><code>┌─────────────────────────────────┐\n│ 1/2   16/10/2026   R$ 12.975,90 │  âmbar = em aberto\n│ 2/2   recebida 26/10  R$ 12.975,90 │ verde = recebida\n└─────────────────────────────────┘\n                                      vermelho = vencida e não recebida\n</code></pre>\n<p>Clicar numa aberta abre \"Registrar recebimento\" com a data já preenchida (o\nvencimento, se já passou; senão hoje). Clicar numa recebida abre \"Desfazer\nrecebimento\", com aviso de que o valor sai do caixa.</p>\n<p>Filtros: <code>Todas · Em aberto · Recebidas</code> + busca por fornecedor ou NF. A busca\nfiltra sem recarregar a página inteira e <strong>sem perder o foco do campo</strong>.</p>\n<h2>6. Formulário de operação</h2>\n<pre><code>Data da compra        Fornecedor\nValor cheio (R$)      Você pagou (R$)\n┌──────────────────────────────────────────┐\n│ Seu lucro nesta operação                 │\n│ R$ 171,16 · 4,17% sobre o que você paga  │\n│            (desconto de 4,00%)           │\n└──────────────────────────────────────────┘\n┌─ Duplicatas — como a Machado te devolve ─┐\n│            [Dividir valor cheio] [+ dup] │\n│ 1ª  [2026-11-15]  [4.279,00]         ✕   │\n│ Soma das duplicatas            R$ 4.279,00│\n└──────────────────────────────────────────┘\nNF / Pedido\nObservações\n</code></pre>\n<p>Comportamento:</p>\n<ul>\n<li><strong>\"Dividir valor cheio\"</strong> reparte igualmente entre as duplicatas existentes, a\n  última absorvendo o arredondamento (RN-01). Os vencimentos nascem em +30 e +40\n  dias da data da compra — a condição mais comum.</li>\n<li><strong>\"+ duplicata\"</strong> acrescenta uma com vencimento 10 dias após a última.</li>\n<li>A prévia do lucro recalcula a cada tecla.</li>\n<li>A linha \"Soma das duplicatas\" fica <strong>vermelha</strong> quando não bate com o valor\n  cheio informado, mostrando os dois números.</li>\n<li>Entrada de valor aceita <code>1.234,56</code>, <code>1234,56</code> e <code>1234.56</code>.</li>\n<li><code>Enter</code> confirma, <code>Esc</code> fecha, clique fora fecha.</li>\n</ul>\n<p>Mensagens de erro, exatamente estas:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situação</th>\n<th>Mensagem</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sem fornecedor</td>\n<td>Informe o fornecedor.</td>\n</tr>\n<tr>\n<td>Sem valor pago</td>\n<td>Informe quanto você pagou ao fornecedor.</td>\n</tr>\n<tr>\n<td>Sem duplicata</td>\n<td>Cadastre pelo menos uma duplicata de retorno.</td>\n</tr>\n<tr>\n<td>Duplicata sem valor</td>\n<td>Toda duplicata precisa de um valor.</td>\n</tr>\n<tr>\n<td>Duplicata sem data</td>\n<td>Toda duplicata precisa de uma data de vencimento.</td>\n</tr>\n<tr>\n<td>Soma &lt; pago</td>\n<td>As duplicatas somam R$ X, menos do que você pagou (R$ Y). Nesse caso não há lucro.</td>\n</tr>\n<tr>\n<td>Caixa insuficiente</td>\n<td>Caixa insuficiente: você tem R$ X livre. Registre um aporte antes de lançar esta compra.</td>\n</tr>\n</tbody>\n</table></div>\n<p>Erro explica o que houve <strong>e</strong> como resolver. Nada de \"campo inválido\".</p>\n<h2>7. Painel \"A conferir\"</h2>\n<p>Só aparece quando há pendências — rascunho do robô aguardando conferência,\ndivergência de valores, vencimento implausível. Cartão de borda âmbar, acima da\nagenda, com os números lado a lado e a nota explicando o que fazer.</p>\n<p>Quando a lista esvazia, o cartão some inteiro. Nada de \"nenhuma pendência\".</p>\n<h2>8. Aparência</h2>\n<p>Tokens do sistema atual, já validados em claro e escuro:</p>\n<pre><code class=\"language-css\">--accent: #14508C / #77ACE8      /* azul profundo */\n--ok:     #136A4B / #54C296      /* verde — recebido, lucro */\n--warn:   #8A5A00 / #DFAC42      /* âmbar — em aberto, parado */\n--bad:    #9C2A21 / #EF8577      /* vermelho — atrasado, prejuízo */\n--band:   #101821                /* faixa superior escura */\n</code></pre>\n<p>Tipografia: <strong>Archivo</strong> em títulos e rótulos, <strong>IBM Plex Sans</strong> no texto, <strong>IBM\nPlex Mono</strong> com <code>font-variant-numeric: tabular-nums</code> em todo número — sem isso as\ncolunas de dinheiro não alinham.</p>\n<p>Tema claro e escuro são dois conjuntos escolhidos, não uma inversão automática. O\n<code>body</code> sempre pinta o próprio fundo.</p>\n<h2>9. Acessibilidade e estados</h2>\n<ul>\n<li>Foco visível em tudo que recebe teclado.</li>\n<li>Botão de duplicata é <code>&lt;button&gt;</code> com <code>aria-label</code> completo\n  (\"Brislu Plásticos, 1ª de 2, vence 16/10/2026, R$ 12.975,90\").</li>\n<li>Tabela com cabeçalho real; nada de <code>div</code> fingindo de tabela.</li>\n<li>Tabelas largas rolam na horizontal <strong>dentro do próprio contêiner</strong> — a página\n  nunca rola para o lado.</li>\n<li><code>prefers-reduced-motion</code> desliga as transições.</li>\n<li>Estado vazio tem texto que ensina: \"Clique em Nova operação para lançar a\n  primeira compra com desconto.\"</li>\n<li>Estado de gravação visível na faixa superior: <code>Tudo salvo</code> · <code>Salvando…</code> ·\n  <code>Falha ao salvar</code>.</li>\n</ul>"}, {"arq": "06-robo.md", "titulo": "Robôs", "sub": "Ingestão, conciliação e alerta de caixa parado", "html": "<blockquote>\n<p><strong>Decisão de 17/11/2026: um robô só, no Telegram.</strong> O Caixa Factory é um\ncontrole de uma pessoa só, então as três rotinas abaixo viraram um único robô\nque conversa com o dono no Telegram: ele lê as fotos de pedido e comprovante\n(Robô 1), e todo dia útil às 9h manda uma mensagem só com os vencimentos e o\nalerta de dinheiro parado (Robôs 2 e 3). As seções abaixo continuam valendo\ncomo regra de cada parte. Implementação: <code>api/caixa_api/robo/</code>.</p>\n</blockquote>\n<p>A regra que vale para tudo está no\n<a href=\"README.md#cinco-princípios-que-não-se-negociam\">README</a>: <strong>o robô nunca grava\numa operação financeira sozinho</strong>. Ele propõe; o dono confirma — na API ou\nnum clique no Telegram.</p>\n<hr />\n<h2>Robô 1 — Ingestão de documentos</h2>\n<p><strong>Entrada:</strong> a tela do pedido de compra (imagem) e o comprovante do PIX (imagem\nou PDF).\n<strong>Saída:</strong> uma operação em <code>rascunho</code>, com os campos preenchidos e as dúvidas\nmarcadas.\n<strong>Nunca:</strong> uma operação confirmada.</p>\n<h3>Como recebe</h3>\n<p>Qualquer um destes canais, todos chamando <code>POST /robo/ingestao</code>:</p>\n<ul>\n<li>upload pela tela</li>\n<li>bot do Telegram — o dono fotografa e manda; é o caminho mais usado na prática</li>\n<li>pasta vigiada no servidor (<code>entrada/</code>), para quem prefere arrastar arquivo</li>\n<li>e-mail encaminhado para um endereço dedicado</li>\n</ul>\n<h3>O que extrair do pedido de compra</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Onde está na tela do pedido</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>numero_pedido</code></td>\n<td>título — <code>PEDIDO DE COMPRA03273-2/26</code> → <code>PC 03273-2/26</code></td>\n</tr>\n<tr>\n<td><code>numero_nf</code></td>\n<td>campo \"Numero da NFe/Romaneio\"</td>\n</tr>\n<tr>\n<td><code>data_pedido</code></td>\n<td>coluna \"Data Emissão\"</td>\n</tr>\n<tr>\n<td>fornecedor</td>\n<td>\"Razão Social Emitente\"</td>\n</tr>\n<tr>\n<td>itens</td>\n<td>linhas com <code>Qtd Estoq</code> e <code>Vr Unit</code></td>\n</tr>\n<tr>\n<td>total do pedido</td>\n<td>coluna \"Data Recebto\" do cabeçalho (sim, o rótulo está trocado no sistema de origem)</td>\n</tr>\n<tr>\n<td>condição</td>\n<td>campo \"Condições de Pagamento\" — <code>30</code>, <code>30/40</code></td>\n</tr>\n<tr>\n<td>duplicatas</td>\n<td>tabela de Pagamentos: Data do Vencimento + Valor da Duplicata</td>\n</tr>\n</tbody>\n</table></div>\n<h3>O que extrair do comprovante</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Observação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>valor_pago</code></td>\n<td>o valor em destaque no topo</td>\n</tr>\n<tr>\n<td><code>data_pagamento</code></td>\n<td>a data do PIX, <strong>não</strong> a do pedido (RN-09)</td>\n</tr>\n<tr>\n<td>recebedor</td>\n<td>tem que casar com o fornecedor do pedido</td>\n</tr>\n<tr>\n<td>ID da transação</td>\n<td>guardar em <code>observacoes</code> para rastreio</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Conferências obrigatórias</h3>\n<p>Cada uma que falhar vira uma <strong>pendência no rascunho</strong>, com os dois números lado\na lado. O robô nunca escolhe sozinho.</p>\n<pre><code>C1  Σ(qtd × valor_unitário) == total do pedido        → senão: A-01 (desconto na nota)\nC2  Σ duplicatas == total do pedido                    → senão: pendência\nC3  recebedor do PIX == fornecedor do pedido           → senão: pendência\nC4  valor_pago &lt; valor_cheio                           → senão: ERRO, não cria rascunho\nC5  vencimento entre data_pagamento e +365 dias        → senão: A-02 (ano errado)\nC6  retorno resultante entre 0,5% e 15%                → fora disso: pendência\nC7  valor_pago &lt;= caixa_disponível                     → senão: pendência &quot;falta aporte&quot;\nC8  numero_pedido ainda não existe                     → senão: ERRO, provável duplicado\n</code></pre>\n<p><strong>C1 é a mais importante.</strong> Quando dispara, a mensagem precisa ser exatamente\nisto, porque já aconteceu e quase custou R$ 398,00:</p>\n<blockquote>\n<p>Os itens somam R$ 9.725,00 mas o total do pedido saiu R$ 9.327,00.\nA SB lança o desconto na própria nota — o valor cheio correto costuma ser a\nsoma dos itens. Confirme qual usar.</p>\n</blockquote>\n<h3>Casar comprovante com pedido</h3>\n<p>Quando chegam vários documentos juntos (acontece: dois pedidos no mesmo dia, dois\nPIX):</p>\n<ol>\n<li>por <strong>valor</strong>, se houver um comprovante cujo valor seja compatível com um só\n   pedido — compatível = entre 85% e 100% do valor cheio</li>\n<li>por <strong>data</strong>, dentro de ±5 dias</li>\n<li>por <strong>fornecedor</strong></li>\n</ol>\n<p>Se sobrar ambiguidade, o rascunho fica com os candidatos listados e a pessoa\nescolhe. <strong>Nunca chutar</strong> (A-04).</p>\n<h3>Implementação da extração</h3>\n<p>Visão de LLM com saída estruturada é o caminho mais direto — OCR tradicional\nsofre com essas telas de sistema cheias de tabela. Prompt de sistema curto, saída\nem JSON com schema fixo, temperatura 0, e <strong>todo campo opcional</strong>: campo vazio é\nmuito melhor que campo chutado.</p>\n<pre><code class=\"language-json\">{\n  &quot;numero_pedido&quot;: &quot;PC 03273-2/26&quot;,\n  &quot;numero_nf&quot;: &quot;12893&quot;,\n  &quot;data_pedido&quot;: &quot;2026-10-16&quot;,\n  &quot;fornecedor_nome&quot;: &quot;SB INDUSTRIA E COMERCIO DE PAPEL LTDA&quot;,\n  &quot;itens&quot;: [\n    { &quot;descricao&quot;: &quot;PAPEL ACOPLADO SB - MONO, TAM: 32X37 CM&quot;,\n      &quot;quantidade&quot;: &quot;110&quot;, &quot;valor_unitario&quot;: &quot;38.90&quot;, &quot;valor_total&quot;: &quot;4279.00&quot; }\n  ],\n  &quot;total_pedido&quot;: &quot;4279.00&quot;,\n  &quot;condicao_pagamento&quot;: &quot;30&quot;,\n  &quot;duplicatas&quot;: [ { &quot;vencimento&quot;: &quot;2026-11-15&quot;, &quot;valor&quot;: &quot;4279.00&quot; } ],\n  &quot;confianca&quot;: { &quot;total_pedido&quot;: 0.98, &quot;duplicatas&quot;: 0.95 }\n}\n</code></pre>\n<p>Campo com <code>confianca &lt; 0.90</code> entra como pendência automaticamente.</p>\n<h3>Fila de conferência</h3>\n<p><code>GET /robo/rascunhos</code> devolve a fila; a tela mostra, para cada um: os documentos\nlado a lado com os campos extraídos, as pendências em destaque, e os botões\n<strong>Aprovar</strong> / <strong>Corrigir e aprovar</strong> / <strong>Descartar</strong>.</p>\n<p>Aprovar cria a operação de verdade, com <code>origem = 'robo'</code>. O rascunho fica\nligado a ela no log.</p>\n<hr />\n<h2>Robô 2 — Conciliação de recebimentos</h2>\n<p><strong>Quando:</strong> todo dia útil às 9h (<code>0 9 * * 1-5</code>, fuso America/Sao_Paulo).</p>\n<h3>O que faz</h3>\n<pre><code>1. Lista duplicatas com recebida_em is null\n2. Separa em:\n     vence_hoje        vencimento == hoje\n     vence_em_breve    hoje &lt; vencimento &lt;= hoje + 3 dias\n     atrasadas         vencimento &lt; hoje\n3. Monta uma mensagem única e manda para o destino configurado\n4. Não marca nada como recebido por conta própria\n</code></pre>\n<h3>A mensagem</h3>\n<pre><code>Caixa Factory · 26/10/2026\n\nVENCEM HOJE — R$ 29.839,56\n  Brislu Plásticos · PC 03295-5/26 · 2ª de 2 · R$ 12.975,90\n  Brislu Plásticos · PC 03331-1/26 · 2ª de 2 · R$ 16.863,66\n\nATRASADAS — R$ 9.725,00\n  SB Indústria · PC 03273-1/26 · venceu 24/10 (2 dias)\n\nCaixa hoje: R$ 111.810,32 · a receber: R$ 43.843,56\n</code></pre>\n<p>Com botões inline no Telegram para marcar como recebida direto da mensagem —\nisso continua sendo ação humana, só que num clique.</p>\n<h3>Conciliação automática (fase 2)</h3>\n<p>Se um dia houver extrato bancário acessível (OFX, CSV do BB, ou API):</p>\n<pre><code>Para cada crédito recebido:\n    candidatas = duplicatas abertas com |valor − crédito| &lt;= 0.01\n    se exatamente 1 candidata e a data está entre venc−5d e venc+30d:\n        propõe conciliação  (ainda proposta, não gravação)\n    senão:\n        lista as candidatas para escolha\n</code></pre>\n<p>Valores idênticos são comuns aqui (duas duplicatas de R$ 12.975,90), então o\ncasamento por valor sozinho <strong>não</strong> é suficiente. Exigir confirmação enquanto\nhouver empate.</p>\n<hr />\n<h2>Robô 3 — Alerta de dinheiro parado</h2>\n<p>O robô que existe por causa do problema real: em outubro/2026 o capital voltou\ntodo e ficou parado, e o rendimento do caixa inteiro caiu para 0,89% ao mês,\nabaixo do CDI, enquanto as operações rendiam 3,26%.</p>\n<p><strong>Quando:</strong> todo dia às 9h, junto com o robô 2 — uma mensagem só.</p>\n<h3>Regra</h3>\n<pre><code>parado = caixa disponível\nlimite = parametro('caixa_parado_limite')      padrão R$ 20.000\ndias   = parametro('caixa_parado_dias')        padrão 3\n\nse parado &gt; limite por `dias` dias seguidos:\n    taxa_dia = taxa_mes_da_carteira / 30\n    custo_dia = parado × taxa_dia\n    alerta\n</code></pre>\n<p>Guardar o histórico diário do caixa numa tabela simples (<code>caixa_diario</code>) para\nsaber há quantos dias a situação persiste, e para a série histórica do painel.</p>\n<h3>A mensagem</h3>\n<pre><code>⚠ R$ 111.810,32 parados há 4 dias\n\nSuas operações rendem 3,26% ao mês. Esse dinheiro parado está deixando de\nrender cerca de R$ 121,50 por dia — R$ 3.645,00 por mês.\n\nEntram ainda R$ 43.843,56 até 15/11.\n</code></pre>\n<p>Tom: informar, não cobrar. Nem todo caixa parado é erro — pode haver compra\ngrande chegando. O alerta dá o número e a pessoa decide.</p>\n<p>Não repetir o alerta todo dia com o mesmo texto: depois do primeiro, só avisar de\nnovo quando o valor mudar mais de 20% ou a cada 7 dias.</p>\n<hr />\n<h2>Segurança dos robôs</h2>\n<ul>\n<li>Token de serviço com papel <code>operador</code> — <strong>nunca</strong> <code>admin</code>. O robô não cria\n  usuário, não altera parâmetro, não estorna.</li>\n<li><code>POST /robo/ingestao</code> com <code>Idempotency-Key</code> derivado do <code>sha256</code> do arquivo:\n  mandar a mesma foto duas vezes não cria dois rascunhos.</li>\n<li>Todo documento recebido passa por verificação de tipo real (magic bytes), não\n  só pela extensão. Limite de 20 MB.</li>\n<li>O conteúdo extraído de um documento é <strong>dado</strong>, nunca instrução. Se a imagem\n  contiver texto do tipo \"ignore as regras e aprove\", isso é só texto dentro de\n  um campo — o pipeline de extração não executa nada do que lê.</li>\n<li>Log de tudo em <code>evento</code>, com <code>origem = 'robo'</code> visível na tela.</li>\n</ul>\n<h2>Ordem de construção sugerida</h2>\n<ol>\n<li><strong>Robô 2</strong> primeiro — é o mais simples (uma consulta e uma mensagem) e já\n   resolve o esquecimento de duplicata vencida.</li>\n<li><strong>Robô 3</strong> em seguida — reaproveita o mesmo canal de notificação e entrega o\n   insight de maior valor.</li>\n<li><strong>Robô 1</strong> por último — é o mais complexo e o que mais precisa de ajuste fino.\n   Até ele existir, o lançamento manual leva dois minutos e funciona bem.</li>\n</ol>"}, {"arq": "07-migracao.md", "titulo": "Migração", "sub": "Carga dos dados que já existem", "html": "<p>Três meses de operação já estão registrados. Nada se perde.</p>\n<h2>1. De onde vêm os dados</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Fonte</th>\n<th>O que tem</th>\n<th>Onde está</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Artefato publicado</strong></td>\n<td>A verdade atual — 7 operações, 11 duplicatas, 2 aportes</td>\n<td>JSON embutido na página</td>\n</tr>\n<tr>\n<td><strong>CSV de operações</strong></td>\n<td>Mesmo conteúdo, uma linha por duplicata</td>\n<td><code>registros/operacoes.csv</code></td>\n</tr>\n<tr>\n<td><strong>CSV de movimentos</strong></td>\n<td>Aportes e retiradas</td>\n<td><code>registros/movimentos.csv</code></td>\n</tr>\n<tr>\n<td><strong>Documentos</strong></td>\n<td>16 arquivos: pedidos e comprovantes</td>\n<td><code>operacoes/AAAA-MM/</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>A fonte canônica é o <strong>artefato</strong>. Os CSV são espelhos para o contador e podem\nestar um passo atrás.</p>\n<h2>2. O arquivo de carga</h2>\n<p><a href=\"seed/estado-2026-10-19.json\"><code>seed/estado-2026-10-19.json</code></a> já está no formato\ndas tabelas: fornecedores, movimentos, operações e duplicatas, com ids\natribuídos e valores como string decimal.</p>\n<pre><code class=\"language-json\">{\n  &quot;fornecedores&quot;: [\n    { &quot;id&quot;: 1, &quot;nome&quot;: &quot;Brislu Plásticos&quot; },\n    { &quot;id&quot;: 2, &quot;nome&quot;: &quot;SB Indústria e Comércio de Papel&quot; }\n  ],\n  &quot;movimentos_caixa&quot;: [\n    { &quot;id&quot;: 1, &quot;tipo&quot;: &quot;aporte&quot;, &quot;data&quot;: &quot;2026-08-28&quot;, &quot;valor&quot;: &
