quot;100000.00&quot;,\n      &quot;observacoes&quot;: &quot;Aporte inicial&quot; }\n  ],\n  &quot;operacoes&quot;: [\n    { &quot;id&quot;: 1, &quot;fornecedor_id&quot;: 1, &quot;numero_pedido&quot;: &quot;PC 03282-2/26&quot;,\n      &quot;data_pagamento&quot;: &quot;2026-08-27&quot;, &quot;valor_pago&quot;: &quot;63321.60&quot;,\n      &quot;valor_cheio&quot;: &quot;65280.00&quot;, &quot;situacao&quot;: &quot;confirmada&quot;, &quot;origem&quot;: &quot;importacao&quot; }\n  ],\n  &quot;duplicatas&quot;: [\n    { &quot;id&quot;: 1, &quot;operacao_id&quot;: 1, &quot;sequencia&quot;: 1, &quot;valor&quot;: &quot;32640.00&quot;,\n      &quot;vencimento&quot;: &quot;2026-09-26&quot;, &quot;recebida_em&quot;: &quot;2026-09-26&quot; }\n  ],\n  &quot;conferencia&quot;: { &quot;caixa&quot;: &quot;111810.32&quot;, &quot;...&quot;: &quot;...&quot; }\n}\n</code></pre>\n<p>O bloco <code>conferencia</code> existe para ser usado: depois da carga, rode <code>GET /resumo</code>\ne compare campo a campo. Divergência de um centavo significa bug no cálculo.</p>\n<h2>3. Como extrair uma versão mais nova</h2>\n<p>O artefato continua em uso e pode ter avançado. Para pegar o estado do dia:</p>\n<pre><code class=\"language-bash\"># o JSON está dentro de &lt;script id=&quot;estado&quot; type=&quot;application/json&quot;&gt;\npython3 - &lt;&lt;'EOF'\nimport re, json\nhtml = open('caixa-machado.html', encoding='utf-8').read()\nm = re.search(r'&lt;script id=&quot;estado&quot; type=&quot;application/json&quot;&gt;(.*?)&lt;/script&gt;', html, re.S)\nestado = json.loads(m.group(1).replace('&lt;\\\\/', '&lt;/'))\nprint(json.dumps(estado, ensure_ascii=False, indent=2))\nEOF\n</code></pre>\n<p>A barra invertida antes de <code>/</code> é escape do HTML — sem o <code>replace</code> o JSON não\nparseia.</p>\n<h3>Formato do artefato → formato das tabelas</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Tabela</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>movimentos[].tipo/data/valor/obs</code></td>\n<td><code>movimento_caixa</code> direto</td>\n</tr>\n<tr>\n<td><code>operacoes[].data</code></td>\n<td><code>operacao.data_pagamento</code> (é a data do PIX)</td>\n</tr>\n<tr>\n<td><code>operacoes[].pago</code></td>\n<td><code>operacao.valor_pago</code></td>\n</tr>\n<tr>\n<td><code>operacoes[].doc</code></td>\n<td>separar em <code>numero_pedido</code> e <code>numero_nf</code> pelo <code>·</code></td>\n</tr>\n<tr>\n<td><code>Σ operacoes[].parcelas[].v</code></td>\n<td><code>operacao.valor_cheio</code></td>\n</tr>\n<tr>\n<td><code>parcelas[].v/d/r</code></td>\n<td><code>duplicata.valor</code> / <code>vencimento</code> / <code>recebida_em</code></td>\n</tr>\n<tr>\n<td><code>parcelas[].r == \"\"</code></td>\n<td><code>recebida_em = NULL</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>A <code>sequencia</code> da duplicata vem da ordem de vencimento.</p>\n<h2>4. Ordem da carga</h2>\n<pre><code class=\"language-sql\">begin;\nset local caixa.usuario_id = '1';\n\n-- 1. fornecedores\n-- 2. movimentos_caixa\n-- 3. operacoes\n-- 4. duplicatas        ← a trigger de soma é deferred, valida no commit\n\n-- reposiciona as sequences\nselect setval('caixa.fornecedor_id_seq',       (select max(id) from caixa.fornecedor));\nselect setval('caixa.operacao_id_seq',         (select max(id) from caixa.operacao));\nselect setval('caixa.duplicata_id_seq',        (select max(id) from caixa.duplicata));\nselect setval('caixa.movimento_caixa_id_seq',  (select max(id) from caixa.movimento_caixa));\n\ncommit;\n</code></pre>\n<p>Esquecer o <code>setval</code> é o erro clássico: o primeiro registro novo colide com id\nexistente.</p>\n<h2>5. Conferência obrigatória pós-carga</h2>\n<pre><code class=\"language-sql\">select * from caixa.v_caixa;\n</code></pre>\n<p>Tem que devolver exatamente:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>campo</th>\n<th>valor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>caixa</td>\n<td>111810.32</td>\n</tr>\n<tr>\n<td>aplicado</td>\n<td>42032.64</td>\n</tr>\n<tr>\n<td>capital</td>\n<td>153842.96</td>\n</tr>\n<tr>\n<td>a_receber</td>\n<td>43843.56</td>\n</tr>\n<tr>\n<td>lucro_realizado</td>\n<td>3842.96</td>\n</tr>\n<tr>\n<td>lucro_a_receber</td>\n<td>1810.92</td>\n</tr>\n</tbody>\n</table></div>\n<p>E a identidade:</p>\n<pre><code class=\"language-sql\">select (caixa + aplicado) = (aportes - retiradas + lucro_realizado) as ok\n  from caixa.v_caixa;   -- precisa ser true\n</code></pre>\n<p>Também confira o resultado mensal contra a tabela de\n<a href=\"03-formulas.md#exemplos-conferidos\">03-formulas.md</a>:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mês</th>\n<th>Lucro</th>\n<th>Aplicado médio</th>\n<th>Parado médio</th>\n<th>Deixou de ganhar</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-08</td>\n<td>249,90</td>\n<td>8.936,52</td>\n<td>3.966,71</td>\n<td>110,92</td>\n</tr>\n<tr>\n<td>2026-09</td>\n<td>3.200,32</td>\n<td>103.260,88</td>\n<td>21.739,12</td>\n<td>673,75</td>\n</tr>\n<tr>\n<td>2026-10</td>\n<td>2.108,57</td>\n<td>56.379,73</td>\n<td>93.620,27</td>\n<td>3.501,35</td>\n</tr>\n<tr>\n<td>2026-11</td>\n<td>95,09</td>\n<td>2.053,92</td>\n<td>147.946,08</td>\n<td>6.849,36</td>\n</tr>\n</tbody>\n</table></div>\n<h2>6. Documentos</h2>\n<p>Os 16 arquivos já estão organizados e <strong>a convenção de nomes do sistema novo é a\nmesma</strong>:</p>\n<pre><code>operacoes/\n  2026-08/\n    2026-08-27_PC-03282-2-26_pedido-compra.png\n    2026-08-28_PC-03282-2-26_comprovante-pix.png\n    2026-08-28_PC-03282-4-26_pedido-compra.png\n    2026-08-28_PC-03282-4-26_comprovante-pix.png\n  2026-09/   (8 arquivos)\n  2026-10/   (2 arquivos)\n</code></pre>\n<p>Padrão: <code>AAAA-MM-DD_PC-&lt;pedido com hífen&gt;_&lt;tipo&gt;.&lt;ext&gt;</code>, onde o tipo é\n<code>pedido-compra</code> ou <code>comprovante-pix</code>, e a data é a do próprio documento (o\npedido e o comprovante podem ser de dias diferentes).</p>\n<p>Script de vinculação:</p>\n<pre><code class=\"language-python\">import re, pathlib\nPADRAO = re.compile(r'(\\d{4}-\\d{2}-\\d{2})_PC-(.+?)_(pedido-compra|comprovante-pix)\\.')\n\nfor arq in pathlib.Path('operacoes').rglob('*'):\n    if not arq.is_file(): continue\n    m = PADRAO.match(arq.name)\n    if not m:\n        print('fora do padrão:', arq); continue\n    data, pedido_slug, tipo = m.groups()\n    numero_pedido = 'PC ' + pedido_slug.replace('-26', '/26', 1)[::-1].replace('-', '-', 1)[::-1]\n    # casar por numero_pedido na tabela operacao e inserir em documento\n</code></pre>\n<p>O <code>sha256</code> de cada arquivo entra na tabela — é o que impede o mesmo comprovante\nde ser anexado duas vezes.</p>\n<h2>7. Cortar o cordão</h2>\n<p>Depois da carga conferida:</p>\n<ol>\n<li>Publique uma última versão do artefato com um aviso no topo: <em>\"Este painel foi\n   substituído pelo Caixa Factory em <code>&lt;endereço&gt;</code>. Mantido apenas para\n   histórico.\"</em></li>\n<li><strong>Não apague o artefato.</strong> Ele é o backup de origem e custa nada manter.</li>\n<li>Guarde <code>seed/estado-2026-10-19.json</code> no repositório — é a prova de que a\n   migração estava certa no dia em que foi feita.</li>\n</ol>"}, {"arq": "08-deploy.md", "titulo": "Deploy", "sub": "VPS Hostinger, domínio Locaweb, HTTPS e backup", "html": "<h2>1. Decisão de DNS — leia antes de mexer</h2>\n<p>O domínio está na Locaweb e o e-mail provavelmente também. <strong>Não troque os\nnameservers da Locaweb para a Hostinger</strong> sem antes copiar os registros MX: a\ntroca de nameservers derruba o e-mail no mesmo instante, e recuperar isso no\nmeio de um dia de trabalho é desagradável.</p>\n<p>O caminho seguro é manter o DNS na Locaweb e criar <strong>um registro A</strong> apontando um\nsubdomínio para o IP da VPS:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Nome</th>\n<th>Valor</th>\n<th>TTL</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td><code>caixa</code></td>\n<td><code>&lt;IP da VPS Hostinger&gt;</code></td>\n<td>3600</td>\n</tr>\n</tbody>\n</table></div>\n<p>Resultado: <code>caixa.machadoemb.com.br</code> → VPS. O site principal, o e-mail e todo o\nresto continuam na Locaweb, intocados.</p>\n<p>No painel da Locaweb isso fica em <strong>Domínios → (seu domínio) → Zona de DNS →\nAdicionar registro</strong>. A propagação costuma levar de minutos a algumas horas;\nconfira com:</p>\n<pre><code class=\"language-bash\">dig +short caixa.machadoemb.com.br\n</code></pre>\n<p>Só prossiga para o HTTPS quando esse comando devolver o IP da VPS — o Certbot\nvalida pelo DNS e falha se ainda estiver propagando.</p>\n<h2>2. Preparar a VPS</h2>\n<p>Ubuntu 22.04 ou 24.04. Primeiro acesso como root:</p>\n<pre><code class=\"language-bash\"># usuário de trabalho, sem senha para sudo\nadduser caixa\nusermod -aG sudo caixa\nrsync --archive --chown=caixa:caixa ~/.ssh /home/caixa\n\n# desligar senha no SSH — só chave\nsed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config\nsed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config\nsystemctl restart ssh\n\n# firewall\nufw allow OpenSSH\nufw allow 'Nginx Full'\nufw --force enable\n\napt update &amp;&amp; apt upgrade -y\napt install -y nginx postgresql postgresql-contrib python3-venv python3-pip \\\n               certbot python3-certbot-nginx fail2ban unattended-upgrades\nsystemctl enable --now fail2ban\ndpkg-reconfigure -plow unattended-upgrades\n</code></pre>\n<p><code>fail2ban</code> e <code>unattended-upgrades</code> não são luxo: uma VPS com IP público leva\ntentativa de invasão na primeira hora de vida.</p>\n<blockquote>\n<p><strong>Atalho:</strong> os passos de 2 a 8 estão automatizados em\n<a href=\"../deploy/instalar.sh\"><code>deploy/instalar.sh</code></a>. Clone o repositório em\n<code>/opt/caixa-factory/repo</code> (deploy key do GitHub, só leitura) e rode\n<code>sudo bash /opt/caixa-factory/repo/CAIXA-FACTORY/deploy/instalar.sh caixa.machadoemb.com.br seu@email</code>.\nO script pode rodar de novo a cada atualização (<code>git pull</code> antes). Ele não mexe\nno SSH. O banco entra pelo socket local com peer auth, sem senha no <code>.env</code>.</p>\n</blockquote>\n<h2>3. Banco</h2>\n<pre><code class=\"language-bash\">sudo -u postgres psql &lt;&lt;'SQL'\ncreate user caixa with password 'TROQUE_ESTA_SENHA';\ncreate database caixa_factory owner caixa;\n\\c caixa_factory\ncreate schema caixa authorization caixa;\nSQL\n</code></pre>\n<p>O Postgres fica ouvindo só em <code>localhost</code> (padrão) — <strong>não abra a porta 5432 no\nfirewall</strong>. A aplicação conversa com ele pelo socket local.</p>\n<p>Rode o DDL de <a href=\"02-modelo-dados.md\">02-modelo-dados.md</a> e depois a carga de\n<a href=\"07-migracao.md\">07-migracao.md</a>.</p>\n<h2>4. Aplicação</h2>\n<pre><code>/opt/caixa-factory/\n  app/            código\n  venv/           virtualenv\n  documentos/     pedidos e comprovantes (o que hoje está em operacoes/AAAA-MM)\n  .env            segredos — chmod 600\n</code></pre>\n<p><code>.env</code>:</p>\n<pre><code class=\"language-ini\">DATABASE_URL=postgresql://caixa:SENHA@localhost/caixa_factory\nSECRET_KEY=&lt;openssl rand -hex 32&gt;\nDOCUMENTOS_DIR=/opt/caixa-factory/documentos\nTZ=America/Sao_Paulo\n# do @BotFather\nTELEGRAM_BOT_TOKEN=\n# o seu chat com o robô (ele ignora qualquer outro)\nTELEGRAM_CHAT_ID=\n# seu usuário no sistema: os cliques no Telegram agem como você\nTELEGRAM_USUARIO_EMAIL=\n# leitura das fotos de pedido e comprovante (Claude)\nANTHROPIC_API_KEY=\nROBO_TOKEN=&lt;openssl rand -hex 32&gt;\n</code></pre>\n<p>Serviço systemd em <code>/etc/systemd/system/caixa-factory.service</code>:</p>\n<pre><code class=\"language-ini\">[Unit]\nDescription=Caixa Factory\nAfter=network.target postgresql.service\n\n[Service]\nUser=caixa\nWorkingDirectory=/opt/caixa-factory/app\nEnvironmentFile=/opt/caixa-factory/.env\nExecStart=/opt/caixa-factory/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000\nRestart=always\nRestartSec=5\n\n# o processo não precisa de nada fora da própria pasta\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\nReadWritePaths=/opt/caixa-factory/documentos\n\n[Install]\nWantedBy=multi-user.target\n</code></pre>\n<pre><code class=\"language-bash\">systemctl daemon-reload\nsystemctl enable --now caixa-factory\n</code></pre>\n<h2>5. Nginx + HTTPS</h2>\n<p><code>/etc/nginx/sites-available/caixa-factory</code>:</p>\n<pre><code class=\"language-nginx\">server {\n    listen 80;\n    server_name caixa.machadoemb.com.br;\n\n    client_max_body_size 25M;          # comprovantes e PDFs\n\n    location / {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_set_header Host              $host;\n        proxy_set_header X-Real-IP         $remote_addr;\n        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n}\n</code></pre>\n<pre><code class=\"language-bash\">ln -s /etc/nginx/sites-available/caixa-factory /etc/nginx/sites-enabled/\nrm -f /etc/nginx/sites-enabled/default\nnginx -t &amp;&amp; systemctl reload nginx\n\ncertbot --nginx -d caixa.machadoemb.com.br --agree-tos -m bruno@machadoemb.com.br\n</code></pre>\n<p>O Certbot reescreve o bloco para 443 e instala a renovação automática. Confira:</p>\n<pre><code class=\"language-bash\">systemctl status certbot.timer\ncertbot renew --dry-run\n</code></pre>\n<p>Depois do HTTPS, acrescente os cabeçalhos no bloco 443:</p>\n<pre><code class=\"language-nginx\">add_header Strict-Transport-Security &quot;max-age=31536000&quot; always;\nadd_header X-Content-Type-Options &quot;nosniff&quot; always;\nadd_header X-Frame-Options &quot;SAMEORIGIN&quot; always;\nadd_header Referrer-Policy &quot;strict-origin-when-cross-origin&quot; always;\n</code></pre>\n<h2>6. Backup — a parte que ninguém faz e depois chora</h2>\n<p>São dados financeiros sem segunda via. Backup diário, fora da VPS.</p>\n<p><code>/opt/caixa-factory/backup.sh</code>:</p>\n<pre><code class=\"language-bash\">#!/usr/bin/env bash\nset -euo pipefail\nDIA=$(date +%F)\nDEST=/opt/caixa-factory/backups\nmkdir -p &quot;$DEST&quot;\n\nsudo -u postgres pg_dump -Fc caixa_factory &gt; &quot;$DEST/banco-$DIA.dump&quot;\ntar czf &quot;$DEST/documentos-$DIA.tar.gz&quot; -C /opt/caixa-factory documentos\n\n# guarda 30 dias localmente\nfind &quot;$DEST&quot; -type f -mtime +30 -delete\n\n# cópia fora da VPS — escolha um:\n# rclone copy &quot;$DEST&quot; remoto:caixa-factory/     # Google Drive, S3, Backblaze\n# rsync -az &quot;$DEST/&quot; usuario@outro-servidor:/backups/caixa-factory/\n</code></pre>\n<pre><code class=\"language-bash\">chmod +x /opt/caixa-factory/backup.sh\n# crontab -e do usuário caixa\n0 2 * * * /opt/caixa-factory/backup.sh &gt;&gt; /var/log/caixa-backup.log 2&gt;&amp;1\n</code></pre>\n<p><strong>Backup que nunca foi restaurado não é backup.</strong> Uma vez por mês, restaure o\ndump num banco de teste e rode a conferência de\n<a href=\"07-migracao.md#5-conferência-obrigatória-pós-carga\">07-migracao.md</a>.</p>\n<p>A Hostinger oferece snapshot da VPS no painel — use <strong>junto</strong>, não no lugar: o\nsnapshot salva a máquina, o <code>pg_dump</code> salva os dados num formato que você\nconsegue abrir em qualquer lugar.</p>\n<h2>7. O robô</h2>\n<p>Um robô só, em dois pedaços: o serviço que conversa no Telegram e o aviso das\n9h no cron.</p>\n<pre><code class=\"language-bash\">cd /opt/caixa-factory/app &amp;&amp; set -a &amp;&amp; . ../.env &amp;&amp; set +a\n../venv/bin/python -m caixa_api.cli criar-robo        # usuário do robô, papel operador\n../venv/bin/python -m caixa_api.robo aviso --mostrar  # confere o texto sem mandar\n</code></pre>\n<p>Para achar o <code>TELEGRAM_CHAT_ID</code>: mande qualquer mensagem para o robô e abra\n<code>https://api.telegram.org/bot&lt;TOKEN&gt;/getUpdates</code> — o número está em\n<code>message.chat.id</code>.</p>\n<p><code>/etc/systemd/system/caixa-robo.service</code>:</p>\n<pre><code class=\"language-ini\">[Unit]\nDescription=Caixa Factory — robô do Telegram\nAfter=network-online.target postgresql.service\n\n[Service]\nUser=caixa\nWorkingDirectory=/opt/caixa-factory/app\nEnvironmentFile=/opt/caixa-factory/.env\nExecStart=/opt/caixa-factory/venv/bin/python -m caixa_api.robo telegram\nRestart=always\nRestartSec=10\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\nReadWritePaths=/opt/caixa-factory/documentos\n\n[Install]\nWantedBy=multi-user.target\n</code></pre>\n<p>O robô usa long polling: não precisa de webhook nem de porta aberta.</p>\n<pre><code class=\"language-cron\"># crontab do usuário caixa — fuso da VPS em America/Sao_Paulo\n0 9 * * 1-5  cd /opt/caixa-factory/app &amp;&amp; set -a &amp;&amp; . ../.env &amp;&amp; set +a &amp;&amp; \\\n             ../venv/bin/python -m caixa_api.robo aviso &gt;&gt; /var/log/caixa-robo.log 2&gt;&amp;1\n</code></pre>\n<p>Num dia sem vencimento, atraso, dinheiro parado nem rascunho esperando, o aviso\nnão manda nada. <code>/aviso</code> no Telegram manda na hora.</p>\n<p>Confirme o fuso da máquina antes:</p>\n<pre><code class=\"language-bash\">timedatectl set-timezone America/Sao_Paulo\n</code></pre>\n<p>Uma VPS em UTC faz o robô das 9h disparar às 6h — erro silencioso e irritante.</p>\n<h2>8. Monitoramento mínimo</h2>\n<pre><code class=\"language-cron\">*/10 * * * * curl -fsS https://caixa.machadoemb.com.br/api/v1/saude &gt; /dev/null \\\n             || echo &quot;Caixa Factory fora do ar&quot; | mail -s alerta bruno@machadoemb.com.br\n</code></pre>\n<p>Melhor ainda: um monitor externo gratuito (UptimeRobot, Better Stack) batendo em\n<code>/api/v1/saude</code>. Monitor que roda na própria máquina não avisa quando a máquina\ncai.</p>\n<p>Lembre que <code>/saude</code> devolve o resultado da asserção de integridade do caixa — se\nela quebrar, os números estão errados e isso precisa acordar alguém.</p>\n<h2>9. Checklist de corte</h2>\n<ul>\n<li>[ ] Registro A criado na Locaweb e propagado (<code>dig</code> devolvendo o IP)</li>\n<li>[ ] MX da Locaweb <strong>intocados</strong> — mande um e-mail de teste para confirmar</li>\n<li>[ ] HTTPS válido, cadeado no navegador, <code>certbot renew --dry-run</code> passando</li>\n<li>[ ] SSH só por chave, root bloqueado, ufw ativo</li>\n<li>[ ] Banco carregado e <code>v_caixa</code> batendo com a tabela de conferência</li>\n<li>[ ] Backup rodando e <strong>uma restauração testada</strong></li>\n<li>[ ] Fuso da VPS em America/Sao_Paulo</li>\n<li>[ ] Token do robô diferente do token de usuário</li>\n<li>[ ] <code>caixa-robo</code> ativo e respondendo <code>/resumo</code> no Telegram</li>\n<li>[ ] Artefato antigo com o aviso de substituição, mas ainda no ar</li>\n</ul>"}]</script>
<script>
const DOCS = JSON.parse(document.getElementById('docs').textContent);

const nav  = document.getElementById('lista');
const sel  = document.getElementById('nav-sel');
const main = document.getElementById('conteudo');

function slug(arq){ return arq.replace(/\.md$/, ''); }

function render(i){
  const d = DOCS[i];
  main.innerHTML =
      '<div class="doc-head"><p class="eyebrow">' + String(i).padStart(2,'0')
    + ' &middot; Caixa Factory</p><h1></h1><p></p></div>'
    + '<article>' + d.html + '</article>';
  main.querySelector('.doc-head h1').textContent = d.titulo;
  main.querySelector('.doc-head p:last-of-type').textContent = d.sub;

  main.querySelectorAll('article a[href$=".md"], article a[href*=".md#"]').forEach(function(a){
    const alvo = a.getAttribute('href').split('#')[0];
    const j = DOCS.findIndex(function(x){ return x.arq === alvo; });
    if (j >= 0) a.setAttribute('href', '#' + slug(DOCS[j].arq));
  });

  nav.querySelectorAll('a').forEach(function(a, k){
    a.classList.toggle('sel', k === i);
    if (k === i) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  sel.value = String(i);
  window.scrollTo({ top: 0 });
}

DOCS.forEach(function(d, i){
  const li = document.createElement('li');
  const a  = document.createElement('a');
  a.href = '#' + slug(d.arq);
  a.innerHTML = '<span class="n">' + String(i).padStart(2,'0') + '</span>';
  a.appendChild(document.createTextNode(d.titulo));
  li.appendChild(a); nav.appendChild(li);

  const op = document.createElement('option');
  op.value = String(i);
  op.textContent = String(i).padStart(2,'0') + ' \u00b7 ' + d.titulo;
  sel.appendChild(op);
});

sel.addEventListener('change', function(){ location.hash = slug(DOCS[Number(sel.value)].arq); });

function doHash(){
  const h = location.hash.replace('#','');
  let i = DOCS.findIndex(function(d){ return slug(d.arq) === h; });
  if (i < 0) i = 0;
  render(i);
}
window.addEventListener('hashchange', doHash);
doHash();
</script>
